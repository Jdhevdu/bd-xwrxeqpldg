<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6A0B0B">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grok Bot">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Grok Bot — FOMO TERMINAL</title>
  <style>
    :root {
      --red-deep: #6A0B0B;
      --red: #8B0000;
      --black: #120000;
      --card: rgba(42, 10, 10, .6);
      --line: #4A1515;
      --text: #ffffff;
      --muted: #A0A0A0;
      --green: #4ADE80;
      --loss: #FF4444;
      --blue: #60A5FA;
      --purple: #C084FC;
      --nav-h: 64px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: linear-gradient(180deg, #8B0000 0%, #6A0B0B 16%, #2a0505 52%, #120000 100%) fixed;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    body { max-width: 480px; margin: 0 auto; overflow-x: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    img { display: block; }

    #boot {
      position: fixed; inset: 0; z-index: 80;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #8B0000, #120000 70%);
      transition: opacity .45s ease, visibility .45s ease;
    }
    #boot.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #boot .app-ico { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
    #boot h1 { margin: 18px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
    #boot .sub { margin-top: 4px; font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
    .spin {
      width: 22px; height: 22px; margin-top: 28px;
      border: 2px solid rgba(255,255,255,.18); border-top-color: #fff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    #boot .load-txt { margin-top: 10px; font-size: 13px; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    #app { padding: calc(10px + env(safe-area-inset-top)) 0 calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
    .brand .ft { font-size: 9px; letter-spacing: .16em; color: var(--muted); font-weight: 700; margin-top: 2px; }
    .live {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .live .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--loss);
      box-shadow: 0 0 0 0 rgba(255,68,68,.7);
      animation: pulse 1.6s infinite;
    }
    .live.off .dot { background: var(--muted); animation: none; box-shadow: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,68,68,.7); }
      70% { box-shadow: 0 0 0 8px rgba(255,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,68,68,0); }
    }
    .appver { margin-left: 8px; opacity: .7; font-size: 9px; letter-spacing: .08em; }
    .eq-cash { font-size: 13px; color: #ffd0d0; font-weight: 600; margin-top: 4px; }
    .badge {
      margin: 0 16px 10px;
      display: inline-block;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      color: #ffd0d0;
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      padding: 4px 8px; border-radius: 999px;
    }
    .errb { margin: 0 16px 10px; background: rgba(255,68,68,.15); color: #ffc9c9; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
    .okb { margin: 0 16px 10px; background: rgba(74,222,128,.16); color: #bbf7d0; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
    .infob { margin: 0 16px 10px; background: rgba(251,191,36,.16); color: #fde68a; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }

    .ticker-wrap { overflow: hidden; margin: 0 0 8px; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
    .ticker { display: flex; gap: 10px; width: max-content; animation: tick 28s linear infinite; padding: 0 16px 6px; }
    .ticker:hover { animation-play-state: paused; }
    @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .tick {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 12px 6px 6px; white-space: nowrap; font-size: 13px; font-weight: 650;
    }
    .av {
      width: 26px; height: 26px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff;
      background: #5a1010;
    }
    .av img { width: 100%; height: 100%; object-fit: cover; }
    .up { color: var(--green); } .down { color: var(--loss); }

    .pad { padding: 0 16px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 14px; margin-bottom: 12px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .eq-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .k { font-size: 12px; color: var(--muted); font-weight: 600; }
    .mult {
      background: #fff; color: #b91c1c; font-weight: 800; font-size: 13px;
      padding: 4px 10px; border-radius: 999px; letter-spacing: -.02em;
    }
    .eq-usd { font-size: 44px; font-weight: 800; letter-spacing: -1.6px; line-height: 1.05; margin: 4px 0 0; }
    .eq-eur { font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .eq-pnl { margin-top: 8px; font-size: 16px; font-weight: 700; }
    .tf { display: flex; gap: 4px; margin: 12px 0 8px; }
    .tf button {
      flex: 1; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .04em;
      color: var(--muted); padding: 6px 0; border-radius: 8px;
    }
    .tf button.on { color: #fff; background: rgba(255,255,255,.1); }
    .chart-box { position: relative; height: 168px; margin: 0 -4px; overflow: hidden; }
    .chart-box canvas { width: 100%; height: 100%; display: block; }
    .annos { position: absolute; inset: 0; pointer-events: none; font-size: 9px; font-weight: 700; }
    .anno {
      position: absolute; transform: translate(-50%, -120%);
      background: rgba(20,0,0,.82); border: 1px solid var(--line);
      padding: 2px 6px; border-radius: 8px; white-space: nowrap; color: #fff;
    }
    .empty-chart { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 16px; }

    .sec-h { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 8px; padding: 0 2px; }
    .sec-h h2 { margin: 0; font-size: 16px; font-weight: 800; }
    .sec-h .run { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--green); }
    .sec-h .run .g { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .sec-h .run.off { color: var(--muted); }
    .sec-h .run.off .g { background: var(--muted); }
    .see { font-size: 13px; color: var(--muted); font-weight: 600; }

    .agent { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .agent:last-child { border-bottom: 0; padding-bottom: 2px; }
    .agent .ico {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(255,255,255,.06); flex-shrink: 0;
    }
    .agent .mid { flex: 1; min-width: 0; }
    .agent .nm { font-size: 14px; font-weight: 700; }
    .agent .sub { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; flex-shrink: 0; }
    .pill.blue { background: rgba(96,165,250,.16); color: var(--blue); }
    .pill.purple { background: rgba(192,132,252,.16); color: var(--purple); }
    .pill.green { background: rgba(74,222,128,.16); color: var(--green); }
    .pill.red { background: rgba(255,68,68,.16); color: var(--loss); }

    .act { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
    .act:last-child { border-bottom: 0; }
    .act .av, .tick .av { width: 36px; height: 36px; font-size: 13px; }
    .act .mid { flex: 1; min-width: 0; }
    .act .nm { font-size: 14px; font-weight: 700; }
    .act .sub { font-size: 12px; color: var(--muted); }
    .act .rhs { text-align: right; font-weight: 700; font-size: 13px; }
    .act .rhs .s { font-size: 11px; font-weight: 650; display: block; }
    .row-in { animation: rowin .35s ease; }
    @keyframes rowin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    .nav {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 0; width: min(480px, 100%);
      display: flex; justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(18, 0, 0, .72); border-top: 1px solid var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 40;
    }
    .nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #7a6a6a; font-size: 10px; font-weight: 700; }
    .nav button.on { color: #fff; }
    .nav svg { width: 22px; height: 22px; }

    .view { display: none; }
    .view.on { display: block; }
    #detail {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: linear-gradient(180deg, #8B0000 0%, #2a0505 40%, #120000 100%);
      overflow: auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    #detail.on { display: block; }
    .back { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #fff; }
    .tok-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .tok-h .av { width: 44px; height: 44px; font-size: 16px; }
    .tok-h .nm { font-size: 22px; font-weight: 800; }
    .tok-h .sp { margin-left: auto; display: flex; gap: 8px; }
    .tok-h .sp button { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.08); display: grid; place-items: center; }
    .mcap { font-size: 40px; font-weight: 800; letter-spacing: -1.4px; margin: 8px 0 2px; }
    .since { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .stats .card { margin: 0; }
    .stats .v { font-size: 16px; font-weight: 800; margin-top: 2px; }
    .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; }
    .row .l { color: var(--muted); }
    .row .r { font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 8px 0 0; }
    .acct p { margin: 0 0 10px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .acct a { color: #ffb4b4; }
    .star.on { color: #fbbf24; }

    .pos { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
    .pos:last-child { border-bottom:0; }
    .pos .rhs { text-align:right; font-weight:800; font-size:13px; line-height:1.2; }
    .btn-sell, .btn-sell-all {
      font-size:12px; font-weight:800; padding:7px 11px; border-radius:999px;
      background:#fff; color:#8B0000; flex-shrink:0;
    }
    .btn-sell-all { background:rgba(255,255,255,.12); color:#fff; }
    .chips { display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto; }
    .chip {
      font-size:12px; font-weight:800; padding:6px 12px; border-radius:999px;
      background:rgba(255,255,255,.08); color:var(--muted); white-space:nowrap;
    }
    .chip.on { background:#fff; color:#8B0000; }
    .feed-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); text-align:left; width:100%; }
    .feed-item:last-child { border-bottom:0; }
    .feed-item .why { font-size:11px; color:var(--muted); margin-top:2px; }
    .dec { font-size:10px; font-weight:800; letter-spacing:.04em; padding:2px 7px; border-radius:999px; flex-shrink:0; text-transform:uppercase; }
    .dec.seen { background:rgba(96,165,250,.16); color:var(--blue); }
    .dec.accepted, .dec.bought { background:rgba(74,222,128,.16); color:var(--green); }
    .dec.rejected, .dec.skipped { background:rgba(255,68,68,.16); color:var(--loss); }
    .nav button { font-size:9px; }

    .ctrl {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    }
    .ctrl .st { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
    .ctrl .st .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 0 3px rgba(74,222,128,.18);
    }
    .ctrl .st.paused .dot { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.2); }
    .ctrl .st.off .dot { background: var(--muted); box-shadow: none; }
    .btn-ctrl {
      font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 999px;
      background: #fff; color: #8B0000; letter-spacing: -.01em;
    }
    .btn-ctrl.start { background: var(--green); color: #052e16; }
    .btn-ctrl:disabled { opacity: .55; }
    .tag-pf {
      display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 800;
      letter-spacing: .04em; padding: 1px 6px; border-radius: 999px;
      background: #fff; color: #b91c1c; vertical-align: middle;
    }
    .tag-pf.tag-grad { background: #3a2a00; color: #ffd36a; }
    .tag-pf.tag-sm { background: #06281a; color: #86efac; }
    .tag-pf.tag-nar { background: #1e1530; color: #d8b4fe; }
    .tag-pf.tag-bundle { background: #3a0000; color: #fda4af; }
    .learn-lesson { font-size: 14px; line-height: 1.45; color: #fff; margin: 0 0 10px; }
    .live.paused { color: #fbbf24; }
    .live.paused .dot { background: #fbbf24; }
    .modal-bg {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(0,0,0,.62);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .modal {
      width: 100%; max-width: 440px;
      background: #1a0505; border: 1px solid var(--line);
      border-radius: 20px; padding: 18px 16px 16px;
    }
    .modal h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
    .modal p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .modal .rowbtns { display: flex; gap: 8px; }
    .modal .rowbtns button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 800; }
    .modal .cancel { background: rgba(255,255,255,.08); color: #fff; }
    .modal .ok { background: #fff; color: #8B0000; }
    .wallet-box {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    }
    .wallet-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .wallet-addr { font-size: 16px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .wallet-bal { font-size: 13px; color: #ffd0d0; font-weight: 600; margin-top: 2px; }
    .wallet-note { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; font-weight: 600; }
    .wallet-alt { margin-top: 8px; font-size: 12px; font-weight: 700; color: #ffb4b4; }
    .wallet-err { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--loss); }
    .btn-wallet {
      font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 999px;
      background: #fff; color: #8B0000; letter-spacing: -.01em; white-space: nowrap;
    }
    .btn-wallet:disabled { opacity: .55; }
    .btn-wallet-off {
      font-size: 12px; font-weight: 800; padding: 7px 11px; border-radius: 999px;
      background: rgba(255,255,255,.12); color: #fff; flex-shrink: 0;
    }
    .wallet-deep { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .wallet-deep a { color: #ffb4b4; font-size: 12px; font-weight: 700; }
    .set-card .k { margin-bottom: 8px; }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .set-row:last-child { border-bottom: 0; }
    .set-row .l { color: var(--muted); font-size: 13px; font-weight: 600; flex: 1; }
    .set-row .nm { font-size: 14px; font-weight: 700; }
    .set-row .sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 600; }
    .set-num { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; }
    .set-num input {
      width: 76px; text-align: right; font: inherit; font-weight: 800; color: #fff;
      background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 10px;
      padding: 7px 8px;
    }
    .sw {
      width: 46px; height: 28px; border-radius: 999px; flex-shrink: 0;
      background: rgba(255,255,255,.14); position: relative;
    }
    .sw::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px; border-radius: 50%; background: #fff;
      transition: transform .18s ease;
    }
    .sw.on { background: var(--green); }
    .sw.on::after { transform: translateX(18px); }
    .set-warn { margin: 8px 0 0; font-size: 12px; font-weight: 700; color: #fde68a; line-height: 1.4; }
    .btn-save {
      width: 100%; margin: 4px 0 8px; padding: 13px; border-radius: 14px;
      background: #fff; color: #8B0000; font-weight: 800; font-size: 15px;
    }
    .btn-save:disabled { opacity: .55; }
    .btn-ghost {
      width: 100%; margin: 0 0 8px; padding: 12px; border-radius: 14px;
      background: rgba(255,255,255,.1); color: #fff; font-weight: 800; font-size: 13px;
    }
    .set-seg { margin: 8px 0 4px; }
    .always { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px;
      background: rgba(74,222,128,.16); color: var(--green); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="boot">
    <img class="app-ico" src="icon-192.png" alt="">
    <h1>Grok Bot</h1>
    <div class="sub">FOMO TERMINAL</div>
    <div class="spin"></div>
    <div class="load-txt">Loading trade feed</div>
  </div>

  <div id="app" hidden>
    <div class="top">
      <div class="brand">
        <img src="icon-192.png" alt="">
        <div>
          <h1>Grok Bot</h1>
          <div class="ft">FOMO TERMINAL</div>
        </div>
      </div>
      <div id="livepill" class="live"><span class="dot"></span> Live</div>
    </div>
    <div class="badge">Realistisch-Modus (Spielgeld) <span class="appver" id="appver">v13</span></div>
    <div id="banners"></div>

    <div id="view-home" class="view on"></div>
    <div id="view-feed" class="view"></div>
    <div id="view-agents" class="view pad"></div>
    <div id="view-activity" class="view pad"></div>
    <div id="view-account" class="view pad"></div>
    <div id="view-settings" class="view pad"></div>
  </div>

  <div id="detail"></div>
  <div id="modal-root"></div>

  <nav class="nav" id="nav">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>

      Account

  </nav>

  <script>
  const POLL_MS = 8000;
  const APP_VERSION = "v13";
  const DATA_BRANCH = "main";
  const bootAt = Date.now();
  let lastData = null;
  let feedFilter = "all";
  let feedItems = [];
  let tab = "home";
  let tf = "LIVE";
  let knownActs = new Set();
  let firstPaint = true;
  let favs = new Set(JSON.parse(localStorage.getItem("fomo_favs") || "[]"));

  const $ = (s, el=document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const de = (n, d=2) => (n==null || Number.isNaN(+n)) ? "—" : Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
  const solAmt = (v) => (v==null || Number.isNaN(+v)) ? "—" : (Number(v).toLocaleString("de-DE", { minimumFractionDigits: 4, maximumFractionDigits: 6 }) + " SOL");
  const usd = (n, d=2) => (n==null || Number.isNaN(+n)) ? "—" : (Number(n)<0?"-":"") + "$" + de(Math.abs(n), d);
  const eur = (n, d=2) => (n==null || Number.isNaN(+n)) ? "—" : de(n, d) + " €";
  const pct = (n, already=false) => {
    if (n==null || Number.isNaN(+n)) return "—";
    const v = already ? Number(n) : Number(n)*100;
    return (v>0?"+":"") + de(v, 2) + "%";
  };
  const cls = (n) => Number(n) >= 0 ? "up" : "down";
  const arrow = (n) => Number(n) >= 0 ? "▲" : "▼";
  const clock = (ts) => {
    if (!ts) return "—";
    const m = String(ts).match(/(\d{2}:\d{2})/);
    return m ? m[1] : esc(ts);
  };
  const hue = (s) => {
    let h = 0;
    for (const c of String(s||"")) h = (h*31 + c.charCodeAt(0)) >>> 0;
    return h % 360;
  };
  function avatar(url, symbol, size) {
    const init = esc((symbol||"?").slice(0,1).toUpperCase());
    const bg = `hsl(${hue(symbol)} 45% 32%)`;
    const src = url ? `<img src="${esc(url)}" alt="" onerror="this.remove()">` : "";
    return `<div class="av" style="background:${bg}${size?`;width:${size}px;height:${size}px`:""}">${src}${init}</div>`;
  }
  function dataCandidates() {
    const urls = [];
    const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
    const parts = location.pathname.split("/").filter((x) => x && x !== "index.html");
    const repo = parts[0] || "";
    if (m && repo) {
      urls.push({ kind: "raw-sha", owner: m[1], repo });
      urls.push({ kind: "raw", url: `https://raw.githubusercontent.com/${m[1]}/${repo}/${DATA_BRANCH}/data.json` });
    }
    urls.push({ kind: "local", url: "data.json" });
    return urls;
  }
  async function fetchJson(url) {
    const sep = url.includes("?") ? "&" : "?";
    const r = await fetch(url + sep + "t=" + Date.now(), { cache: "no-store", mode: "cors" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function latestDataSha(owner, repo) {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=data.json&per_page=1&t=${Date.now()}`, {
      cache: "no-store", headers: { Accept: "application/vnd.github+json" }
    });
    if (!r.ok) throw new Error("sha HTTP " + r.status);
    const arr = await r.json();
    const sha = arr && arr[0] && arr[0].sha;
    if (!sha) throw new Error("no sha");
    return sha;
  }
  async function loadData() {
    let lastErr;
    for (const c of dataCandidates()) {
      try {
        if (c.kind === "raw-sha") {
          const sha = await latestDataSha(c.owner, c.repo);
          return await fetchJson(`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${sha}/data.json`);
        }
        return await fetchJson(c.url);
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error("no data");
  }

  function hideBoot() {
    const wait = Math.max(0, 1100 - (Date.now() - bootAt));
    setTimeout(() => { $("#boot").classList.add("hide"); $("#app").hidden = false; document.body.dataset.ready = "true"; }, wait);
  }

  function filterHistory(hist, key) {
    if (!hist || !hist.length) return [];
    const now = Date.now() / 1000;
    if (key === "LIVE") {
      const start = (lastData && lastData.started_ts) ? Number(lastData.started_ts) : now - 6*3600;
      const from = Math.min(start, now - 30*60);
      const out = hist.filter(p => (p.t || 0) >= from - 5);
      return out.length ? out : hist.slice();
    }
    const span = { "1H": 3600, "4H": 4*3600, "1D": 86400, "1W": 7*86400, ALL: Infinity }[key] || Infinity;
    if (!isFinite(span)) return hist.slice();
    const cut = now - span;
    const out = hist.filter(p => (p.t || 0) >= cut);
    if (out.length < 2) {
      const older = hist.filter(p => (p.t || 0) < cut);
      if (older.length) return [older[older.length-1], ...out];
    }
    return out;
  }

  function drawEquity(canvas, points, events) {
    const wrap = canvas.parentElement;
    const old = wrap.querySelector(".annos, .empty-chart");
    if (old) [...wrap.querySelectorAll(".annos, .empty-chart")].forEach(n => n.remove());
    const w = canvas.clientWidth, h = canvas.clientHeight, r = window.devicePixelRatio || 1;
    if (w < 8 || h < 8) {
      requestAnimationFrame(() => drawEquity(canvas, points, events));
      return;
    }
    canvas.width = w * r; canvas.height = h * r;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!points || points.length < 1) {
      wrap.insertAdjacentHTML("beforeend", `<div class="empty-chart">Noch wenig Verlauf — der Bot zeichnet ab jetzt jede Änderung auf.</div>`);
      return;
    }
    const vals = points.map(p => p.usd);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max === min) { min -= 0.2; max += 0.2; }
    const padL = 2, padR = 2, padT = 18, padB = 8;
    const xOf = (i) => padL + (w - padL - padR) * (points.length === 1 ? 0.5 : i / (points.length - 1));
    const yOf = (v) => padT + (h - padT - padB) * (1 - (v - min) / (max - min));
    const path = new Path2D();
    points.forEach((p, i) => {
      const x = xOf(i), y = yOf(p.usd);
      if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
    });
    const fill = new Path2D(path);
    fill.lineTo(xOf(points.length-1), h - padB);
    fill.lineTo(xOf(0), h - padB);
    fill.closePath();
    const g = ctx.createLinearGradient(0, padT, 0, h);
    g.addColorStop(0, "rgba(255,68,68,.35)");
    g.addColorStop(1, "rgba(255,68,68,0)");
    ctx.fillStyle = g;
    ctx.fill(fill);
    ctx.strokeStyle = "#FF6B6B";
    ctx.lineWidth = 2.4;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke(path);

    const annos = document.createElement("div");
    annos.className = "annos";
    const t0 = points[0].t, t1 = points[points.length-1].t || t0+1;
    (events || []).forEach(ev => {
      const t = ev.ts;
      if (t == null || t < t0 - 60 || t > t1 + 60) return;
      const x = padL + (w - padL - padR) * ((t - t0) / (t1 - t0 || 1));
      // interpolate y
      let y = yOf(points[points.length-1].usd);
      for (let i = 1; i < points.length; i++) {
        if (t <= points[i].t) {
          const a = points[i-1], b = points[i];
          const u = (t - a.t) / (b.t - a.t || 1);
          y = yOf(a.usd + (b.usd - a.usd) * u);
          break;
        }
      }
      let label = ev.kind === "Bought" ? `🛒 Bought ${ev.symbol}` : ev.kind === "Sold 50%" ? `💰 Sold ${ev.symbol}` + (ev.pnl_usd!=null?` ${ev.pnl_usd>=0?"+":""}$${Math.abs(ev.pnl_usd).toFixed(2)}`: "") : ev.title;
      const el = document.createElement("div");
      el.className = "anno";
      el.style.left = `${Math.max(28, Math.min(w-28, x))}px`;
      el.style.top = `${Math.max(22, Math.min(h-10, y))}px`;
      el.textContent = label;
      annos.appendChild(el);
    });
    wrap.appendChild(annos);
  }

  function tickerHtml(positions) {
    if (!positions.length) return "";
    const item = (p) => `<button class="tick" data-open="${esc(p.symbol)}">${avatar(p.image_url, p.symbol)}${esc(p.symbol)}${pumpTag(p)} <span class="${cls(p.pnl_usd != null ? p.pnl_usd : p.pnl_pct)}">${p.pnl_usd!=null?((p.pnl_usd>=0?"+":"")+usd(p.pnl_usd)+" "):""}${arrow(p.pnl_pct)} ${pct(p.pnl_pct)}</span></button>`;
    const row = positions.map(item).join("");
    const copies = positions.length < 3 ? row + row + row + row : row + row;
    return `<div class="ticker-wrap"><div class="ticker">${copies}</div></div>`;
  }

  function ico(name) {
    const svgs = {
      scan: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>`,
      brain: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="8" cy="9" r="2"/><circle cx="16" cy="9" r="2"/><circle cx="12" cy="15" r="2"/><path d="M10 9h4M9 11.2 11 13.4M15 11.2 13 13.4"/></svg>`,
      bolt: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M13 3 5 13h6l-1 8 9-11h-6l1-7z"/></svg>`,
      shield: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/></svg>`
    };
    return svgs[name];
  }

  function agentsHtml(d, compact) {
    const a = d.agents || {};
    const paused = !!(d.paused || d.status === "paused");
    const running = a.running > 0 && d.running && !paused;
    const rows = [
      ["scan", a.scanner],
      ["brain", a.analyst],
      ["bolt", a.executor],
      ["shield", a.risk]
    ].filter(x => x[1]);
    const body = rows.map(([ic, r]) => `
      <div class="agent">
        <div class="ico">${ico(ic)}</div>
        <div class="mid">
          <div class="nm">${esc(r.name)} · ${esc(r.title)}</div>
          <div class="sub">${esc(r.token || r.detail || "—")}</div>
        </div>
        <span class="pill ${esc(r.pill_kind || "blue")}">${esc(r.pill || "")}</span>
      </div>`).join("");
    return `
      <div class="sec-h">
        <h2>Agents</h2>
        <div class="run ${running?"":"off"}"><span class="g"></span>${esc(paused ? "Paused" : (running ? (a.running_label || "4 running") : "stopped"))}</div>
      </div>
      <div class="card">${body || `<div class="hint">Keine Agent-Daten.</div>`}</div>
      ${lernenHtml(d)}`;
  }

  function pumpTag(p) {
    if (!p) return "";
    let s = "";
    if (p.tag === "pump.fun" || p.early) s += `<span class="tag-pf">pump.fun</span>`;
    else if (p.tag === "graduiert" || p.graduated) s += `<span class="tag-pf tag-grad">graduiert</span>`;
    if (p.smart_label) {
      const bundle = String(p.smart_label).indexOf("Bundle") >= 0;
      s += `<span class="tag-pf ${bundle?"tag-bundle":"tag-sm"}">${esc(p.smart_label)}</span>`;
    } else if (p.smart_n) {
      s += `<span class="tag-pf tag-sm">Smart Money: ${esc(p.smart_n)} Wallet${p.smart_n==1?"":"s"}</span>`;
    }
    if (p.narrative) s += `<span class="tag-pf tag-nar">${esc(p.narrative)}</span>`;
    return s;
  }

  function lernenHtml(d) {
    const L = (d && d.learn) || {};
    const n = L.trades_learned || 0;
    const lesson = L.last_lesson || "Noch keine Lektion — der Bot übt mit Papiergeld und lernt nach jedem Trade.";
    const params = L.params || [];
    const rows = params.map(r => `<div class="row"><span class="l">${esc(r.label)}</span><span class="r">${esc(r.value)}</span></div>`).join("");
    const recent = (L.recent || []).slice().reverse().map(h =>
      `<div class="sub" style="margin:6px 0">${esc(h.when || "")} · ${esc(h.lesson || "")}</div>`
    ).join("");
    return `
      <div class="sec-h"><h2>Lernen</h2><div class="run">${n} Trade${n===1?"":"s"}</div></div>
      <div class="card acct">
        <p class="learn-lesson">${esc(lesson)}</p>
        ${rows || `<div class="hint">Noch keine Parameter geladen.</div>`}
        ${recent ? `<div class="k" style="margin:12px 0 4px">Letzte Änderungen</div>${recent}` : ""}
        <p class="hint">${esc(L.bounds_note || "")}</p>
      </div>`;
  }

  function activityRows(items, animate) {
    if (!items || !items.length) return `<div class="hint">Noch keine Trades.</div>`;
    return items.map(t => {
      const fresh = animate && t.t && !knownActs.has(t.t + t.kind + t.symbol);
      const amt = t.amount_usd != null ? usd(t.amount_usd) : "";
      const pnl = t.pnl_usd != null ? `<span class="s ${cls(t.pnl_usd)}">${t.pnl_usd>=0?"+":""}${usd(t.pnl_usd)}${t.pnl_pct!=null?` (${pct(t.pnl_pct)})`:""}</span>` : "";
      const title = t.title || [t.kind, t.symbol].filter(Boolean).join(" ");
      return `<button class="act${fresh?" row-in":""}" data-open="${esc(t.symbol||"")}">
        ${avatar(t.image_url, t.symbol)}
        <div class="mid"><div class="nm">${esc(title)}</div><div class="sub">${esc(t.subtitle || "")}</div></div>
        <div class="rhs">${amt}${pnl}</div>
      </button>`;
    }).join("");
  }

  function renderHome(d) {
    const hist = filterHistory(d.equity_history || [], tf);
    const ev = d.trade_events || d.trades || [];
    $("#view-home").innerHTML = `
      ${tickerHtml(d.positions || [])}
      <div class="pad">
        <div class="card">
          <div class="eq-head">
            <div class="k">Equity · started with ${usd(d.start_usd)}</div>
            <div class="mult">${de((d.multiplier || (d.start_usd ? d.equity_usd / d.start_usd : 1)), 2)}x</div>
          </div>
          <div class="eq-usd" data-count="equity_usd">${usd(d.equity_usd)}</div>
          <div class="eq-eur">${eur(d.equity_eur)}${d.equity_sol!=null? " · "+solAmt(d.equity_sol):""}</div>
          <div class="eq-cash" data-count="cash_usd">Bargeld ${d.cash_sol!=null?solAmt(d.cash_sol)+" · ":""}${d.cash_usd!=null?usd(d.cash_usd):"—"}</div>
          <div class="eq-pnl ${cls(d.pnl_usd)}">${d.pnl_usd>=0?"+":""}${usd(d.pnl_usd)} (${pct(d.roi_pct, true)})</div>
          ${walletHtml()}
          ${controlHtml(d)}
          <div class="tf">${["LIVE","1H","4H","1D","1W","ALL"].map(x => `<button data-tf="${x}" class="${tf===x?"on":""}">${x}</button>`).join("")}</div>
          <div class="chart-box"><canvas id="eqchart"></canvas></div>
        </div>
        ${positionsHtml(d)}
        ${agentsHtml(d, true)}
        <div class="sec-h"><h2>Activity</h2><button class="see" data-tab="activity">See all</button></div>
        <div class="card" id="home-act">${activityRows((d.trade_events || d.trades || []).slice(0,6), !firstPaint)}</div>
      </div>`;
    const paint = () => { const c = $("#eqchart"); if (c) drawEquity(c, hist, ev); };
    requestAnimationFrame(() => requestAnimationFrame(paint));
    setTimeout(paint, 120);
  }

  function renderAgents(d) { $("#view-agents").innerHTML = agentsHtml(d); }
  function renderActivity(d) {
    $("#view-activity").innerHTML = `
      <div class="sec-h"><h2>Activity</h2></div>
      <div class="card">${activityRows(d.trade_events || d.trades || [], !firstPaint)}</div>
      ${d.scanner_highlights && d.scanner_highlights.length ? `
        <div class="sec-h"><h2>Scanner</h2></div>
        <div class="card">${d.scanner_highlights.slice(0,25).map(s => `
          <div class="act">
            ${avatar(null, s.symbol)}
            <div class="mid"><div class="nm">${esc(s.kind==="Rejected"?"Rejected":s.kind==="Scored"?"Scored":s.kind==="Skipped"?"Skipped":s.kind)} ${esc(s.symbol||"")}</div>
            <div class="sub">${esc(s.reason || s.text || "")}</div></div>
            <div class="rhs" style="color:var(--muted);font-weight:600">${clock(s.t)}</div>
          </div>`).join("")}</div>` : ""}`;
  }
  function renderAccount(d) {
    const r = d.rules || {};
    $("#view-account").innerHTML = `
      <div class="sec-h"><h2>Account</h2></div>
      <div class="card acct">
        <p><button class="see" data-tab="settings" type="button">Einstellungen öffnen</button></p>
        <p><strong style="color:#fff">Realistisch-Modus (Spielgeld).</strong> ${esc(r.mode_note || "Nur simuliertes Guthaben, keine echten Trades.")}</p>
        <div class="row"><span class="l">Startkapital</span><span class="r">${usd(d.start_usd)} · ${eur(d.start_eur)}${d.start_sol!=null? " · "+solAmt(d.start_sol):""}</span></div>
        <div class="row"><span class="l">Aktuelles Equity</span><span class="r">${usd(d.equity_usd)} · ${eur(d.equity_eur)}${d.equity_sol!=null? " · "+solAmt(d.equity_sol):""}</span></div>
        <div class="row"><span class="l">Bargeld (Wallet)</span><span class="r">${d.cash_sol!=null?solAmt(d.cash_sol)+" · ":""}${usd(d.cash_usd)}</span></div>
        <div class="row"><span class="l">Realisiert</span><span class="r">${usd(d.realized_usd)}</span></div>
        <div class="row"><span class="l">Gebühren gesamt</span><span class="r">${usd(d.fees_usd)}</span></div>
        <div class="row"><span class="l">— Swap / Slippage</span><span class="r">${usd((d.fees||{}).swap)} / ${usd((d.fees||{}).slippage)}</span></div>
        <div class="row"><span class="l">— Netz / Priority / Jito</span><span class="r">${usd((d.fees||{}).network)} / ${usd((d.fees||{}).priority)} / ${usd((d.fees||{}).jito)}</span></div>
        <div class="row"><span class="l">— Token-Konto (Rent)</span><span class="r">${usd((d.fees||{}).rent)}</span></div>
        <div class="row"><span class="l">Fehlgeschlagene Trades</span><span class="r">${d.failed_count||0}</span></div>
        <div class="row"><span class="l">Fast loop p50 / p95 / max</span><span class="r">${(d.loop_latency&&d.loop_latency.n)?(d.loop_latency.p50_ms+" / "+d.loop_latency.p95_ms+" / "+d.loop_latency.max_ms+" ms"):"—"}</span></div>
        <div class="row"><span class="l">Letztes Update</span><span class="r">${esc(d.last_update || "—")} (Europe/Vienna)</span></div>
      </div>

  function fmtMcap(n) {

    if (v >= 1e6) return "$" + de(v/1e6, 2) + "M";
    if (v >= 1e3) return "$" + de(v/1e3, 2) + "K";
    return usd(v, 0);
  }
  function ageLabel(iso) {

    return de(d, d < 10 ? 1 : 0) + "d old";
  }

  async function loadTokenMarket(p) {
    const pool = p.pool;
    if (!pool) { $("#dt-mcap").textContent = "—"; $("#st-mcap").textContent = "—"; $("#st-vol").textContent = "—"; return; }
    try {
      const r = await fetch(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${encodeURIComponent(pool)}`, { cache: "no-store" });
      if (r.ok) {
        const j = await r.json();
        const a = (j.data && j.data.attributes) || {};
        const mc = parseFloat(a.market_cap_usd || a.fdv_usd);
        const vol = a.volume_usd && (a.volume_usd.h24 || a.volume_usd.h1);
        const age = ageLabel(a.pool_created_at);
        $("#dt-mcap").textContent = fmtMcap(mc);
        $("#st-mcap").textContent = fmtMcap(mc);
        $("#st-vol").textContent = vol ? fmtMcap(parseFloat(vol)) : "—";
        $("#dt-meta").textContent = `${p.symbol} · Solana${age ? " · " + age : ""}`;
      }
    } catch {}
    let candles = [];
    for (const path of [
      `ohlcv/minute?aggregate=5&limit=120`,
      `ohlcv/hour?aggregate=1&limit=72`
    ]) {
      try {
        const r = await fetch(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${encodeURIComponent(pool)}/${path}`, { cache: "no-store" });
        if (!r.ok) continue;
        const j = await r.json();
        const list = (((j.data||{}).attributes)||{}).ohlcv_list || [];
        if (list.length) { candles = list.slice().reverse(); break; }
      } catch {}
    }
    drawCandles($("#candle"), candles, p.entry_price, p.current_price);
  }

  function drawCandles(canvas, rows, entry, current) {
    if (!canvas) return;
    const wrap = canvas.parentElement;
    wrap.querySelectorAll(".empty-chart").forEach(n => n.remove());
    const w = canvas.clientWidth, h = canvas.clientHeight, r = window.devicePixelRatio || 1;
    canvas.width = w * r; canvas.height = h * r;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!rows.length) {
      // fallback: two-point line
      if (entry && current) {
        drawEquity(canvas, [{t:0,usd:entry},{t:1,usd:current}], []);
        return;
      }
      wrap.insertAdjacentHTML("beforeend", `<div class="empty-chart">Kein Chart verfügbar.</div>`);
      return;
    }
    // rows: [ts, o, h, l, c, v]
    const padT = 10, padB = 28, padL = 2, padR = 2;
    const chartH = h - padT - padB;
    let lo = Math.min(...rows.map(x => x[3])), hi = Math.max(...rows.map(x => x[2]));
    if (entry) { lo = Math.min(lo, entry); hi = Math.max(hi, entry); }
    if (current) { lo = Math.min(lo, current); hi = Math.max(hi, current); }
    if (hi === lo) { hi += hi*0.01; lo -= lo*0.01; }
    const yOf = (v) => padT + chartH * (1 - (v - lo) / (hi - lo));
    const maxV = Math.max(...rows.map(x => x[5] || 0), 1);
    const slot = (w - padL - padR) / rows.length;
    const cw = Math.max(1, slot * 0.62);
    // volume
    rows.forEach((c, i) => {
      const x = padL + i * slot + slot/2;
      const vh = (c[5] / maxV) * (padB - 4);
      ctx.fillStyle = c[4] >= c[1] ? "rgba(74,222,128,.35)" : "rgba(255,68,68,.35)";
      ctx.fillRect(x - cw/2, h - 2 - vh, cw, vh);
    });
    // shade entry-current
    if (entry && current) {
      const y1 = yOf(entry), y2 = yOf(current);
      ctx.fillStyle = current >= entry ? "rgba(74,222,128,.12)" : "rgba(255,68,68,.12)";
      ctx.fillRect(padL, Math.min(y1,y2), w-padL-padR, Math.abs(y2-y1));
    }
    if (entry) {
      ctx.setLineDash([4,4]); ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, yOf(entry)); ctx.lineTo(w-padR, yOf(entry)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "rgba(255,255,255,.8)"; ctx.font = "10px Inter, sans-serif";
      ctx.fillText("Bought", padL + 4, yOf(entry) - 4);
    }
    if (current) {
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padL, yOf(current)); ctx.lineTo(w-padR, yOf(current)); ctx.stroke();
    }
    rows.forEach((c, i) => {
      const x = padL + i * slot + slot/2;
      const up = c[4] >= c[1];
      ctx.strokeStyle = ctx.fillStyle = up ? "#4ADE80" : "#FF4444";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yOf(c[2])); ctx.lineTo(x, yOf(c[3])); ctx.stroke();
      const yb = yOf(Math.max(c[1], c[4])), yt = yOf(Math.min(c[1], c[4]));
      const bh = Math.max(1, yt - yb);
      ctx.fillRect(x - cw/2, yb, cw, bh);
    });
  }

  const WALLET_LS = "fomo_wallet_v1";
  const SOLANA_RPC = "https://api.mainnet-beta.solana.com";
  const SOLANA_RPC_FALLBACK = "https://solana-rpc.publicnode.com";
  const WALLET_NOTICE = "Nur verbunden – der Bot handelt weiter mit Spielgeld. Bitte eine separate Bot-Wallet verwenden, nicht die Haupt-Wallet.";
  let walletState = {
    status: "idle",
    address: null,
    providerName: null,
    balanceSol: null,
    balanceErr: false,
    error: null
  };
  let walletBusy = false;
  let walletBalanceAt = 0;

  function shortAddr(a) {
    const s = String(a || "");
    if (s.length < 10) return s || "—";
    return s.slice(0, 4) + "…" + s.slice(-4);
  }
  function loadWalletLs() {
    try { return JSON.parse(localStorage.getItem(WALLET_LS) || "null"); }
    catch (_) { return null; }
  }
  function saveWalletLs(addr, name) {
    try { localStorage.setItem(WALLET_LS, JSON.stringify({ address: addr, provider: name || "phantom" })); }
    catch (_) {}
  }
  function clearWalletLs() {
    try { localStorage.removeItem(WALLET_LS); } catch (_) {}
  }
  function phantomProvider() {
    const injected = window.phantom && window.phantom.solana;
    if (injected && typeof injected.connect === "function") return injected;
    const s = window.solana;
    if (s && typeof s.connect === "function" && s.isPhantom) return s;
    return null;
  }
  function solflareProvider() {
    const s = window.solflare || (window.solana && window.solana.isSolflare ? window.solana : null);
    if (s && typeof s.connect === "function") return s;
    return null;
  }
  function hasInjectedWallet() { return !!(phantomProvider() || solflareProvider()); }
  function isMobileUa() { return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || ""); }
  function appBrowseUrl() { return location.origin + location.pathname + location.search; }
  function phantomBrowseLink() {
    return "https://phantom.app/ul/browse/" + encodeURIComponent(appBrowseUrl()) + "?ref=" + encodeURIComponent(location.origin);
  }
  function solflareBrowseLink() {
    return "https://solflare.com/ul/v1/browse/" + encodeURIComponent(appBrowseUrl()) + "?ref=" + encodeURIComponent(location.origin);
  }
  function pubkeyOf(resp, provider) {
    const pk = (resp && resp.publicKey) || (provider && provider.publicKey);
    if (!pk) return null;
    if (typeof pk === "string") return pk;
    try { if (typeof pk.toBase58 === "function") return pk.toBase58(); } catch (_) {}
    try { if (typeof pk.toString === "function") return pk.toString(); } catch (_) {}
    return null;
  }

  function walletHtml() {
    const note = `<p class="wallet-note">${esc(WALLET_NOTICE)}</p>`;
    if (walletState.status === "connected" && walletState.address) {
      const bal = walletState.balanceSol != null
        ? solAmt(walletState.balanceSol)
        : (walletState.balanceErr ? "Guthaben nicht verfügbar" : "Guthaben wird geladen…");
      const who = walletState.providerName === "solflare" ? "Solflare" : "Phantom";
      return `<div class="wallet-box" id="wallet-box">
        <div class="wallet-row">
          <div>
            <div class="k">Verbunden · ${esc(who)}</div>
            <div class="wallet-addr" title="${esc(walletState.address)}">${esc(shortAddr(walletState.address))}</div>
            <div class="wallet-bal" id="wallet-bal">${esc(bal)}</div>
          </div>
          <button class="btn-wallet-off" type="button" id="btn-wallet-disconnect">Trennen</button>
        </div>
        ${note}
      </div>`;
    }
    const err = walletState.error ? `<div class="wallet-err">${esc(walletState.error)}</div>` : "";
    const needDeep = !hasInjectedWallet();
    const deep = needDeep ? `<div class="wallet-alt">${isMobileUa()
      ? "Kein Wallet im Browser. Tippe auf „Wallet verbinden“, um die Seite in der Phantom-App zu öffnen."
      : "Kein Wallet gefunden. Bitte die Phantom-Erweiterung installieren oder die Seite in der Phantom-App öffnen (nur über HTTPS)."}</div>
      ${isMobileUa() ? `<div class="wallet-deep"><a href="${esc(solflareBrowseLink())}">Oder in Solflare öffnen</a></div>` : ""}` : "";
    const label = walletState.status === "connecting" ? "Verbinden…" : "Wallet verbinden";
    return `<div class="wallet-box" id="wallet-box">
      <div class="wallet-row">
        <div class="k">Wallet</div>
        <button class="btn-wallet" type="button" id="btn-wallet-connect"${walletState.status==="connecting"?" disabled":""}>${label}</button>
      </div>
      ${deep}${err}${note}
    </div>`;
  }

  function bindWallet() {
    const c = document.getElementById("btn-wallet-connect");
    if (c) c.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); connectWallet(); };
    const d = document.getElementById("btn-wallet-disconnect");
    if (d) d.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); disconnectWallet(); };
  }

  async function connectWallet() {
    if (walletBusy) return;
    const ph = phantomProvider();
    const sf = solflareProvider();
    if (!ph && !sf) {
      if (isMobileUa()) {
        location.href = phantomBrowseLink();
        return;
      }
      walletState.error = "Kein Wallet gefunden. Phantom unter https://phantom.app installieren und die Seite über HTTPS öffnen.";
      if (lastData) { renderHome(lastData); bindHome(); }
      return;
    }
    walletBusy = true;
    walletState.status = "connecting";
    walletState.error = null;
    if (lastData) { renderHome(lastData); bindHome(); }
    try {
      const provider = ph || sf;
      const name = ph ? "phantom" : "solflare";
      const resp = await provider.connect();
      const addr = pubkeyOf(resp, provider);
      if (!addr) throw new Error("Keine Adresse erhalten");
      await setConnected(addr, name, provider);
    } catch (e) {
      walletState.status = "idle";
      walletState.error = (e && (e.code === 4001 || e.code === "4001"))
        ? "Verbindung abgebrochen."
        : ((e && e.message) ? String(e.message) : "Verbindung fehlgeschlagen.");
      if (lastData) { renderHome(lastData); bindHome(); }
    } finally {
      walletBusy = false;
    }
  }

  async function setConnected(addr, name, provider) {
    walletState.status = "connected";
    walletState.address = addr;
    walletState.providerName = name;
    walletState.error = null;
    walletState.balanceErr = false;
    if (walletState.balanceSol == null) walletBalanceAt = 0;
    saveWalletLs(addr, name);
    bindProviderEvents(provider);
    if (lastData) { renderHome(lastData); bindHome(); }
    else {
      const box = document.getElementById("wallet-box");
      if (box) { /* home not painted yet */ }
    }
    await refreshBalance(true);
  }

  async function silentReconnect() {
    const ph = phantomProvider();
    const sf = solflareProvider();
    const saved = loadWalletLs();
    const prefer = (saved && saved.provider === "solflare") ? (sf || ph) : (ph || sf);
    if (!prefer) return;
    try {
      const resp = await prefer.connect({ onlyIfTrusted: true });
      const addr = pubkeyOf(resp, prefer);
      if (!addr) return;
      const name = (prefer.isSolflare && !prefer.isPhantom) ? "solflare" : "phantom";
      await setConnected(addr, name, prefer);
    } catch (_) {}
  }

  async function disconnectWallet() {
    const ph = phantomProvider();
    const sf = solflareProvider();
    try { if (ph && typeof ph.disconnect === "function") await ph.disconnect(); } catch (_) {}
    try { if (sf && typeof sf.disconnect === "function") await sf.disconnect(); } catch (_) {}
    clearWalletLs();
    walletState = { status: "idle", address: null, providerName: null, balanceSol: null, balanceErr: false, error: null };
    if (lastData) { renderHome(lastData); bindHome(); }
  }

  async function rpcGetBalance(addr, url) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "getBalance", params: [addr] }),
      cache: "no-store"
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const lamports = data && data.result && data.result.value;
    if (typeof lamports !== "number") throw new Error("bad rpc");
    return lamports / 1e9;
  }

  async function refreshBalance(force) {
    const addr = walletState.address;
    if (!addr) return;
    if (!force && walletBalanceAt && (Date.now() - walletBalanceAt) < 30000) return;
    try {
      let sol = null;
      try { sol = await rpcGetBalance(addr, SOLANA_RPC); }
      catch (_) { sol = await rpcGetBalance(addr, SOLANA_RPC_FALLBACK); }
      walletState.balanceSol = sol;
      walletState.balanceErr = false;
    } catch (_) {
      walletState.balanceErr = true;
    }
    walletBalanceAt = Date.now();
    const el = document.getElementById("wallet-bal");
    if (el) {
      el.textContent = walletState.balanceSol != null ? solAmt(walletState.balanceSol) : "Guthaben nicht verfügbar";
    }
  }

  function bindProviderEvents(provider) {
    if (!provider || typeof provider.on !== "function" || provider.__fomoBound) return;

        const addr = pk ? pubkeyOf({ publicKey: pk }, provider) : null;

        walletState.address = addr;
        walletState.balanceSol = null;
        saveWalletLs(addr, walletState.providerName || "phantom");
        if (lastData) { renderHome(lastData); bindHome(); }
        refreshBalance(true);
      });
      provider.on("disconnect", () => {
        clearWalletLs();
        walletState = { status: "idle", address: null, providerName: null, balanceSol: null, balanceErr: false, error: null };
        if (lastData) { renderHome(lastData); bindHome(); }
      });

  function collectSettings() {
    const out = {};
    document.querySelectorAll("#view-settings [data-set]").forEach(inp => {
      const k = inp.dataset.set;
      const n = Number(inp.value);
      if (Number.isNaN(n)) return;
      out[k] = SET_PCT.has(k) ? (n / 100) : n;
    });
    document.querySelectorAll("#view-settings [data-set-toggle]").forEach(btn => {
      out[btn.dataset.setToggle] = btn.getAttribute("aria-pressed") === "true";
    });
    const seg = document.querySelector("#view-settings [data-set-seg]");
    if (seg) {
      const on = seg.querySelector("button.on");
      if (on) out[seg.dataset.setSeg] = on.dataset.val;
    }
    return out;
  }

  function bindSettings() {
    const root = $("#view-settings");
    if (!root) return;
    const mark = () => { settingsDirty = true; };
    root.querySelectorAll("[data-set]").forEach(inp => { inp.oninput = mark; inp.onchange = mark; });
    root.querySelectorAll("[data-set-toggle]").forEach(btn => {
      btn.onclick = (ev) => {
        ev.preventDefault();
        const on = btn.getAttribute("aria-pressed") !== "true";
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.classList.toggle("on", on);
        if (btn.dataset.setToggle === "daily_limit_on") {
          const w = document.getElementById("daily-warn");
          if (w) w.hidden = on;
        }
        mark();
      };
    });
    const seg = root.querySelector("[data-set-seg]");
    if (seg) seg.querySelectorAll("button[data-val]").forEach(btn => {
      btn.onclick = () => {
        seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
        mark();
      };
    });
    const save = document.getElementById("btn-settings-save");
    if (save) save.onclick = () => sendSettings("set_settings", collectSettings());
    const def = document.getElementById("btn-settings-default");
    if (def) def.onclick = () => confirmSettings(
      "Standard wiederherstellen?",
      "Alle Optionen gehen auf die Werkseinstellung zurück. Das Lernen bleibt erhalten, bis du es extra zurücksetzt.",
      () => sendSettings("reset_settings")
    );
    const lr = document.getElementById("btn-learn-reset");
    if (lr) lr.onclick = () => confirmSettings(

  async function sendSettings(cmd, settings) {

  let statusBanner = null; // {kind, text, t}
  let lastAckTs = 0;
  function setStatus(kind, text) {
    statusBanner = { kind, text, t: Date.now() };

  }
  function paintBanners(d, stale) {
    d = d || {};
    const banners = [];
    if (statusBanner) {
      const cls = statusBanner.kind === "ok" ? "okb" : (statusBanner.kind === "info" ? "infob" : "errb");
      banners.push(`<div class="${cls}">${esc(statusBanner.text)}</div>`);
    }
    if (stale) banners.push(`<div class="errb">Keine frischen Daten — letzte bekannte Werte werden angezeigt.</div>`);
    if (d.error) banners.push(`<div class="errb">${esc(d.error)}</div>`);
    if (d.halted) banners.push(`<div class="errb">Risk: Tagesverlust-Limit erreicht. Heute keine neuen Käufe.</div>`);
    const b = document.getElementById("banners");
    if (b) b.innerHTML = banners.join("");

  function noteAck(ack) {
    if (!ack || ack.t !== "cmdack") return false;
    const ts = Number(ack.ts || 0);
    const tsSec = ts > 1e12 ? ts / 1000 : ts;
    if (tsSec && tsSec <= lastAckTs) return false;
    if (tsSec) lastAckTs = tsSec;
    if (tsSec && (Date.now()/1000 - tsSec) > 60) return false; // ignore stale acks on first paint
    const acmd = ack.cmd || "";
    if (acmd === "set_settings" || acmd === "reset_settings" || acmd === "reset_params") {
      if (ack.settings && lastData) lastData.settings = Object.assign(lastData.settings || {}, ack.settings);
      settingsDirty = false;
      if (ack.ok && ack.pending) setStatus("info", "Einstellungen unterwegs…");
      else if (ack.ok) setStatus("ok", "Gespeichert ✓");
      else setStatus("err", ack.error || "Einstellungen konnten nicht gespeichert werden.");
      if (tab === "settings") renderSettings(lastData || {}, true);
      return true;
    }
    if (acmd === "pause" || acmd === "resume") {
      setStatus("ok", acmd === "pause" ? "Bot pausiert." : "Bot gestartet.");
      return true;
    }
    if (ack.ok) {
      const name = ack.symbol || "";
      const pnl = (ack.pnl_usd != null && ack.pnl_usd !== "") ? ` (${ack.pnl_usd>=0?"+":""}${usd(ack.pnl_usd)})` : "";
      setStatus("ok", name ? (`Verkauft: ${name}${pnl}`) : ("Verkauft." + pnl));
    } else {
      setStatus("err", ack.error || "Verkauf fehlgeschlagen.");
    }
    return true;
  }

  function animateText(el, from, to, fmt, ms) {
    if (!el || to == null || Number.isNaN(to)) return;
    const start = (from == null || Number.isNaN(from)) ? to : from;
    const t0 = performance.now();
    const dur = ms || 420;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(start + (to - start) * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function normFeed(e) {
    const mint = e.mint || "";
    return {
      id: e.id || (mint + ":" + (e.decision || e.d || "") + ":" + (e.ts || e.t || "")),
      t: e.t, ts: e.ts || 0,
      symbol: e.symbol || e.s || "?",
      mint, pool: e.pool, dex: e.dex,
      early: !!(e.early || e.dex === "pump-fun" || e.dex === "pumpfun" || e.tag === "pump.fun"),
      graduated: !!(e.graduated || e.tag === "graduiert" || e.venue === "pump.fun-grad"),
      source: e.source || e.src || e.origin || "",
      mcap: e.mcap || e.mc || e.fdv,
      liq: e.liq || e.liquidity_usd,
      age_min: e.age_min != null ? e.age_min : e.age,
      decision: e.decision || e.d || "seen",
      reason: e.reason || e.why || "",
      score: e.score != null ? e.score : e.sc,
      image_url: e.image_url || (mint ? ("https://cdn.dexscreener.com/tokens/solana/" + mint + ".png") : null)
    };
  }

  function mergeFeed(list) {
    const byId = new Map(feedItems.map(x => [x.id, x]));
    (list || []).forEach(e => {
      const n = normFeed(e);
      if (n.id) byId.set(n.id, n);
    });
    feedItems = [...byId.values()].sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 250);
  }

  function feedRow(e) {
    const dec = e.decision || "seen";
    let mc = "—";
    if (e.mcap) mc = e.mcap >= 1000 ? ("$" + (e.mcap/1000).toFixed(1) + "k") : usd(e.mcap);
    const age = e.age_min != null ? (e.age_min < 60 ? (Math.max(0, Math.round(e.age_min)) + "m") : ((e.age_min/60).toFixed(1) + "h")) : "";
    const why = e.reason || (e.score != null ? ("score " + e.score) : "");
    return `<button class="feed-item" data-open="${esc(e.symbol || "")}">
      ${avatar(e.image_url, e.symbol)}
      <div class="mid">
        <div class="nm">${esc(e.symbol || "?")}${pumpTag(e)}</div>
