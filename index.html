<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paper Bot">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Paper Bot — Spielgeld</title>
  <style>
    :root {
      --bg: #07080d;
      --bg2: #0d0f16;
      --card: #14171f;
      --card2: #1a1e28;
      --line: rgba(255,255,255,.07);
      --text: #f3f5fa;
      --muted: #8b91a3;
      --dim: #5c6272;
      --green: #3ee98a;
      --green-bg: rgba(62,233,138,.12);
      --red: #ff5d6c;
      --red-bg: rgba(255,93,108,.12);
      --amber: #f5c542;
      --amber-bg: rgba(245,197,66,.14);
      --blue: #7aa6ff;
      --blue-bg: rgba(122,166,255,.12);
      --radius: 18px;
      --pad: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px; line-height: 1.4;
      min-height: 100%;
    }
    body {
      padding: calc(12px + env(safe-area-inset-top)) var(--pad) calc(28px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    .top {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 14px;
    }
    .brand { min-width: 0; }
    .brand h1 {
      margin: 0; font-size: 13px; font-weight: 650; letter-spacing: .08em;
      text-transform: uppercase; color: var(--muted);
    }
    .badge {
      display: inline-block; margin-top: 6px;
      background: var(--amber-bg); color: var(--amber);
      font-size: 11px; font-weight: 700; letter-spacing: .04em;
      padding: 4px 8px; border-radius: 999px;
    }
    .status {
      display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
      font-size: 12px; color: var(--muted); text-align: right; flex-shrink: 0;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 700; font-size: 13px;
      padding: 5px 10px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--line);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    .pill.on { color: var(--green); background: var(--green-bg); border-color: transparent; }
    .pill.on .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(62,233,138,.2); }
    .pill.delay { color: var(--amber); background: var(--amber-bg); border-color: transparent; }
    .pill.delay .dot { background: var(--amber); }
    .pill.off { color: var(--red); background: var(--red-bg); border-color: transparent; }
    .pill.off .dot { background: var(--red); }

    .hero {
      background: linear-gradient(180deg, #1a1e2a 0%, #12141c 100%);
      border: 1px solid var(--line); border-radius: 22px;
      padding: 20px 18px 16px; margin-bottom: 14px;
    }
    .hero .k { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .hero .eur {
      font-size: 52px; font-weight: 750; letter-spacing: -1.5px;
      line-height: 1.05; margin: 6px 0 2px;
      font-variant-numeric: tabular-nums;
    }
    .hero .usd { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
    .hero .pnl {
      margin-top: 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px;
    }
    .up { color: var(--green); }
    .down { color: var(--red); }
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-top: 16px;
    }
    .stat {
      background: rgba(0,0,0,.28); border-radius: 12px; padding: 10px 8px;
      text-align: center;
    }
    .stat .v { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

    .warn, .err, .halt {
      border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; font-weight: 600;
    }
    .warn { background: var(--amber-bg); color: var(--amber); }
    .err { background: var(--red-bg); color: var(--red); }
    .halt { background: var(--red-bg); color: var(--red); }

    h2 {
      margin: 22px 0 10px; font-size: 13px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    h2 span.count { font-weight: 650; letter-spacing: 0; text-transform: none; color: var(--dim); }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 14px 14px 12px; margin-bottom: 10px;
    }
    .pos-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .sym { font-size: 20px; font-weight: 750; letter-spacing: -.02em; word-break: break-word; }
    .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .chg { font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
    .rows { margin-top: 12px; display: grid; gap: 6px; }
    .row { display: flex; justify-content: space-between; font-size: 13px; gap: 8px; }
    .row .l { color: var(--muted); }
    .row .r { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
    .tag {
      display: inline-block; margin-top: 10px;
      font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px;
    }
    .tag.tp-open { background: var(--blue-bg); color: var(--blue); }
    .tag.tp-done { background: var(--green-bg); color: var(--green); }

    .empty { color: var(--dim); font-size: 14px; padding: 16px; text-align: center; }

    .trade, .scan {
      display: grid; grid-template-columns: 64px 86px 1fr;
      gap: 8px; align-items: start;
      padding: 10px 0; border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .trade:last-child, .scan:last-child { border-bottom: 0; padding-bottom: 2px; }
    .trade .tm, .scan .tm { color: var(--dim); font-variant-numeric: tabular-nums; padding-top: 2px; }
    .kind { font-weight: 700; }
    .k-Bought { color: var(--green); }
    .k-Sold { color: var(--green); }
    .k-Trail { color: var(--amber); }
    .k-Stopped, .k-Rugged, .k-Max-hold { color: var(--red); }
    .k-Rejected { color: var(--muted); }
    .k-Scored { color: var(--blue); }
    .k-Skipped { color: var(--amber); }
    .k-Graduated { color: #ffb347; }
    .trade .tx, .scan .tx { color: var(--text); word-break: break-word; }
    .scan-sym { font-weight: 700; }
    .scan-why { color: var(--muted); font-size: 12px; margin-top: 1px; }
    .note { font-size: 12px; color: var(--dim); margin: -4px 0 10px; }

    .mods { display: flex; flex-direction: column; gap: 0; }
    .mod {
      display: flex; justify-content: space-between; gap: 12px;
      padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px;
    }
    .mod:last-child { border-bottom: 0; }
    .mod b { font-weight: 700; flex-shrink: 0; }
    .mod span { color: var(--muted); text-align: right; }

    .hint {
      margin-top: 22px; color: var(--dim); font-size: 12px; line-height: 1.5; text-align: center;
    }
    .skel { opacity: .55; }
    @media (min-width: 420px) {
      .hero .eur { font-size: 56px; }
    }
  </style>
</head>
<body>
  <div id="app" class="skel">
    <div class="top">
      <div class="brand">
        <h1>Paper Memecoin Bot</h1>
        <div class="badge">Spielgeld / Paper Trading</div>
      </div>
      <div class="status"><div class="pill"><span class="dot"></span> Lädt…</div></div>
    </div>
    <div class="hero">
      <div class="k">Kontostand</div>
      <div class="eur">—</div>
      <div class="usd">Daten werden geladen</div>
    </div>
  </div>
  <script>
    const POLL_MS = 15000;
    const app = document.getElementById("app");
    let lastData = null;
    let failCount = 0;

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

    function de(n, d = 2) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      return Number(n).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    const eur = (n, d = 2) => de(n, d) + "\u00a0€";
    const usd = (n, d = 2) => de(n, d) + "\u00a0$";
    function pct(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const v = Number(n);
      const sign = v > 0 ? "+" : "";
      return sign + de(v, 2) + "\u00a0%";
    }
    function price(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const v = Math.abs(Number(n));
      let d = 2;
      if (v < 0.000001) d = 10;
      else if (v < 0.0001) d = 9;
      else if (v < 0.01) d = 7;
      else if (v < 1) d = 5;
      else d = 4;
      return de(n, d) + "\u00a0$";
    }
    function cls(n) { return Number(n) >= 0 ? "up" : "down"; }
    function kindClass(kind) {
      if (!kind) return "";
      if (kind.startsWith("Sold")) return "k-Sold";
      if (kind.startsWith("Rugged")) return "k-Rugged";
      return "k-" + kind.replace(/[^A-Za-z0-9-]/g, "");
    }
    function clock(ts) {
      if (!ts) return "—";
      const m = String(ts).match(/(\d{2}:\d{2}:\d{2})/);
      if (m) return m[1].slice(0, 5);
      return esc(ts);
    }
    function clockFull(ts) {
      if (!ts) return "—";
      const m = String(ts).match(/(\d{2}:\d{2}:\d{2}\s+\S+)/);
      return m ? m[1] : esc(ts);
    }
    function pill(d) {
      const st = d.status || (d.running ? "running" : "stopped");
      const label = d.status_label || (st === "running" ? "Läuft" : "Steht");
      const klass = st === "running" ? "on" : st === "delayed" ? "delay" : "off";
      return `<div class="pill ${klass}"><span class="dot"></span> ${esc(label)}</div>`;
    }

    function render(d, stale) {
      const pnlCls = cls(d.roi_pct);
      const positions = d.positions || [];
      const trades = d.trades || [];
      const scans = (d.scanner_highlights && d.scanner_highlights.length)
        ? d.scanner_highlights
        : (d.scanner || []);
      const mods = d.modules || [];

      const posHtml = positions.length ? positions.map((p) => `
        <article class="card">
          <div class="pos-head">
            <div>
              <div class="sym">${esc(p.symbol)}</div>
              <div class="meta">${esc(p.dex || "")}${p.score != null ? " · Score " + esc(p.score) : ""} · gehalten ${esc(p.held)}</div>
            </div>
            <div class="chg ${cls(p.pnl_pct)}">${pct((p.pnl_pct || 0) * 100)}</div>
          </div>
          <div class="rows">
            <div class="row"><span class="l">Einstieg</span><span class="r">${price(p.entry_price)}</span></div>
            <div class="row"><span class="l">Aktueller Preis</span><span class="r">${price(p.current_price)}</span></div>
            <div class="row"><span class="l">Wert / Einsatz</span><span class="r">${usd(p.value_usd)} / ${usd(p.cost_open_usd)}</span></div>
            <div class="row"><span class="l">Gewinn / Verlust</span><span class="r ${cls(p.pnl_usd)}">${Number(p.pnl_usd) >= 0 ? "+" : ""}${usd(p.pnl_usd)}</span></div>
          </div>
          <span class="tag ${p.tp_done ? "tp-done" : "tp-open"}">${esc(p.tp_label)}</span>
        </article>`).join("") : `<div class="card empty">Keine offenen Positionen</div>`;

      const tradeHtml = trades.length ? trades.map((t) => `
        <div class="trade">
          <div class="tm">${clock(t.t)}</div>
          <div class="kind ${kindClass(t.kind)}">${esc(t.kind)}</div>
          <div class="tx">${esc(t.text)}</div>
        </div>`).join("") : `<div class="empty">Noch keine Trades</div>`;

      const scanHtml = scans.length ? scans.map((s) => `
        <div class="scan">
          <div class="tm">${clock(s.t)}</div>
          <div class="kind ${kindClass(s.kind)}">${esc(s.kind === "Rejected" ? "Abgelehnt" : s.kind === "Scored" ? "Bewertet" : s.kind === "Skipped" ? "Übersprungen" : s.kind === "Graduated" ? "Graduiert" : s.kind)}</div>
          <div class="tx">
            <div class="scan-sym">${esc(s.symbol || "")}</div>
            <div class="scan-why">${esc(s.reason || s.text || "")}</div>
          </div>
        </div>`).join("") : `<div class="empty">Noch keine Scanner-Ereignisse</div>`;

      const modHtml = mods.length ? mods.map((m) => `
        <div class="mod"><b>${esc(m.name)}</b><span>${esc(m.detail)}</span></div>`).join("") : "";

      const banners = [
        stale ? `<div class="err">Keine frischen Daten — letzte bekannte Werte werden angezeigt.</div>` : "",
        d.error ? `<div class="err">${esc(d.error)}</div>` : "",
        d.halted ? `<div class="halt">Risk: Tagesverlust-Limit erreicht. Heute keine neuen Käufe (Vienna).</div>` : "",
      ].join("");

      app.classList.remove("skel");
      app.setAttribute("data-ready", "true");
      app.innerHTML = `
        <div class="top">
          <div class="brand">
            <h1>Paper Memecoin Bot</h1>
            <div class="badge">${esc(d.label || "Spielgeld / Paper Trading")}</div>
          </div>
          <div class="status">
            ${pill(d)}
            <div>Update ${clockFull(d.last_update)}</div>
          </div>
        </div>
        ${banners}
        <section class="hero">
          <div class="k">Kontostand</div>
          <div class="eur">${eur(d.equity_eur)}</div>
          <div class="usd">${usd(d.equity_usd)} · Start ${eur(d.start_eur)}</div>
          <div class="pnl ${pnlCls}">
            <span>${pct(d.roi_pct)}</span>
            <span>${Number(d.pnl_eur) >= 0 ? "+" : ""}${eur(d.pnl_eur)}</span>
            <span style="font-weight:600;font-size:14px;opacity:.85">${Number(d.pnl_usd) >= 0 ? "+" : ""}${usd(d.pnl_usd)}</span>
          </div>
          <div class="stats">
            <div class="stat"><div class="v">${usd(d.cash_usd)}</div><div class="l">Bargeld</div></div>
            <div class="stat"><div class="v ${cls(d.realized_usd)}">${Number(d.realized_usd) >= 0 ? "+" : ""}${usd(d.realized_usd)}</div><div class="l">Realisiert</div></div>
            <div class="stat"><div class="v">${usd(d.fees_usd)}</div><div class="l">Gebühren</div></div>
          </div>
        </section>
        <h2>Offene Positionen <span class="count">${positions.length}</span></h2>
        ${posHtml}
        <h2>Letzte Trades <span class="count">${trades.length}</span></h2>
        <div class="card">${tradeHtml}</div>
        <h2>Scanner <span class="count">${scans.length}</span></h2>
        ${d.curve_skips ? `<div class="note">${de(d.curve_skips, 0)} Bonding-Curve-Coins (pump.fun u. a.) in diesem Log-Ausschnitt übersprungen — nur geprüfte oder anders abgelehnte Coins unten.</div>` : ""}
        <div class="card">${scanHtml}</div>
        <h2>Module</h2>
        <div class="card mods">${modHtml}</div>
        <p class="hint">
          Nur Spielgeld, keine echten Trades. Zeiten in Europe/Vienna.<br>
          Zum Home-Bildschirm: im Browser „Teilen“ bzw. Menü → „Zum Home-Bildschirm“.<br>
          Aktualisiert alle 15 Sekunden.
          ${d.started_at ? "Bot gestartet " + esc(d.started_at) + "." : ""}
        </p>`;
    }

    const DATA_BRANCH = "main";

    function dataCandidates() {
      const urls = [];
      const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
      const parts = location.pathname.split("/").filter((x) => x && x !== "index.html");
      const repo = parts[0] || "";
      if (m && repo) {
        urls.push({ kind: "raw-sha", owner: m[1], repo });
        urls.push({
          kind: "raw",
          url: "https://raw.githubusercontent.com/" + m[1] + "/" + repo + "/" + DATA_BRANCH + "/data.json"
        });
      }
      urls.push({ kind: "local", url: "data.json" });
      return urls;
    }

    async function fetchJson(url) {
      const sep = url.indexOf("?") >= 0 ? "&" : "?";
      const r = await fetch(url + sep + "t=" + Date.now(), { cache: "no-store", mode: "cors" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }

    async function latestDataSha(owner, repo) {
      const r = await fetch(
        "https://api.github.com/repos/" + owner + "/" + repo +
          "/commits?path=data.json&per_page=1&t=" + Date.now(),
        { cache: "no-store", headers: { Accept: "application/vnd.github+json" } }
      );
      if (!r.ok) throw new Error("sha HTTP " + r.status);
      const arr = await r.json();
      const sha = arr && arr[0] && arr[0].sha;
      if (!sha) throw new Error("no sha");
      return sha;
    }

    async function loadData() {
      let lastErr;
      for (const c of dataCandidates()) {
        try {
          if (c.kind === "raw-sha") {
            const sha = await latestDataSha(c.owner, c.repo);
            return await fetchJson(
              "https://raw.githubusercontent.com/" + c.owner + "/" + c.repo + "/" + sha + "/data.json"
            );
          }
          return await fetchJson(c.url);
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error("no data");
    }

    async function tick() {
      try {
        const d = await loadData();
        lastData = d;
        failCount = 0;
        render(d, false);
      } catch (e) {
        failCount += 1;
        if (lastData) render(lastData, true);
        else {
          app.setAttribute("data-ready", "true");
          app.innerHTML = `<div class="err">Dashboard-Daten konnten nicht geladen werden. Seite über einen Webserver öffnen (nicht als Datei).</div>`;
        }
      }
    }

    tick();
    setInterval(tick, POLL_MS);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
