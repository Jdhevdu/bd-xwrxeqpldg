<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06070b">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grok Bot">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://demo.tbmq.io">
  <link rel="preconnect" href="https://raw.githubusercontent.com">
  <link rel="preconnect" href="https://api.dexscreener.com">
  <link rel="preload" as="script" href="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>Grok Bot — Terminal</title>
  <style>
:root{
  --bg:#06070b;--panel:#0d0e13;--panel2:#12131a;--line:#1b1d26;--line2:#262935;
  --txt:#f3f4f7;--mut:#7c8195;--mut2:#5a5f72;--green:#2ee59d;--red:#ff4d6d;--blue:#5b7cfa;--blue2:#4766f0;
  --yellow:#f5c84c;--violet:#a78bfa;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;max-width:100%;background:var(--bg);color:var(--txt);font:13px/1.35 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.up{color:var(--green)}.down{color:var(--red)}.mut{color:var(--mut)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(64px + var(--safe-b))}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(6,7,11,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + var(--safe-t)) 12px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;letter-spacing:.02em}
.brand img{width:22px;height:22px;border-radius:6px}
.paper{font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--yellow);border:1px solid rgba(245,200,76,.35);border-radius:4px;padding:1px 5px}
.live{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--mut);margin-left:auto}
.live .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.live.off .dot{background:var(--red);box-shadow:none}
.bal-row{display:flex;align-items:flex-end;gap:10px;margin-top:8px}
.bal .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.bal .v{font-size:22px;font-weight:800;letter-spacing:-.01em}
.bal .s{font-size:11px;color:var(--mut)}
.today .v{font-size:14px;font-weight:700}
.auto{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.auto .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.sw{position:relative;width:74px;height:34px;border-radius:999px;background:#23252f;border:1px solid var(--line2);transition:.2s;display:flex;align-items:center}
.sw .knob{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#8b90a3;transition:.2s}
.sw .lbl{position:absolute;right:10px;font-size:11px;font-weight:800;color:var(--mut)}
.sw.on{background:rgba(46,229,157,.18);border-color:rgba(46,229,157,.55)}
.sw.on .knob{left:43px;background:var(--green);box-shadow:0 0 10px rgba(46,229,157,.6)}
.sw.on .lbl{left:10px;right:auto;color:var(--green)}
.sw.busy{opacity:.6}
.auto-note{margin-top:7px;font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:flex-start}
.auto-note b{color:var(--txt)}
.auto-note.on b{color:var(--green)}
.auto-note.off b{color:var(--yellow)}
/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(9,10,14,.97);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--safe-b)}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mut);font-weight:600;position:relative}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{color:var(--txt)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--blue);border-radius:2px}
nav.tabs .cnt{position:absolute;top:4px;left:calc(50% + 6px);background:var(--blue);color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:0 5px;line-height:14px}
/* pulse */
.seg{display:flex;gap:4px;padding:8px 12px 0;position:sticky;top:var(--toph,128px);z-index:15;background:var(--bg)}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:12px;font-weight:700;color:var(--mut);background:var(--panel);border:1px solid var(--line)}
.seg button.on{color:var(--txt);border-color:var(--line2);background:var(--panel2)}
.seg button .n{font-size:10px;color:var(--mut2);margin-left:3px}
.toolbar{display:flex;gap:6px;align-items:center;padding:8px 12px;position:sticky;top:calc(var(--toph,128px) + 40px);z-index:14;background:var(--bg);border-bottom:1px solid var(--line)}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 8px;height:32px}
.search input{flex:1;background:none;border:0;outline:0;min-width:0;font-size:12px}
.qb-amt{display:flex;align-items:center;gap:4px;height:32px;padding:0 8px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:12px}
.qb-amt svg{width:13px;height:13px;color:var(--yellow)}
.qb-amt input{width:46px;background:none;border:0;outline:0;font-weight:700;text-align:right}
.cols{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 100%;min-width:0;max-width:100%;overflow:hidden;scroll-snap-align:start;min-height:60vh}
.row{display:flex;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.row:active{background:var(--panel)}
.logo{position:relative;width:42px;height:42px;flex:0 0 42px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;border:1px solid var(--line2)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo .dx{position:absolute;right:-1px;bottom:-1px;width:15px;height:15px;border-radius:4px;font-size:8px;font-weight:900;display:grid;place-items:center;background:#000;border:1px solid var(--line2);z-index:2}
.mid{flex:1;min-width:0;overflow:hidden}
.l1{display:flex;align-items:center;gap:5px;min-width:0}
.tk{font-weight:800;font-size:13.5px;white-space:nowrap}
.nm{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.l2{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden}
.age{color:var(--green);font-weight:700}
.ic{display:inline-flex;width:15px;height:15px;align-items:center;justify-content:center;color:var(--mut)}
.ic svg{width:12px;height:12px}
.l3{display:flex;gap:5px;margin-top:4px;flex-wrap:nowrap;overflow:hidden}
.chip{font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:#14161e;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.g{color:var(--green);border-color:rgba(46,229,157,.25)}
.chip.r{color:var(--red);border-color:rgba(255,77,109,.25)}
.chip.y{color:var(--yellow);border-color:rgba(245,200,76,.25)}
.ps{font-size:9.5px;font-weight:800;padding:1px 4px;border-radius:4px}
.ps.hi{background:rgba(46,229,157,.15);color:var(--green)}
.ps.md{background:rgba(245,200,76,.14);color:var(--yellow)}
.ps.lo{background:#1a1c24;color:var(--mut)}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.mc{font-size:11px;color:var(--mut);white-space:nowrap}
.mc b{color:var(--txt);font-size:13px}
.vol{font-size:10.5px;color:var(--mut);white-space:nowrap}
.qb{display:inline-flex;align-items:center;gap:3px;background:var(--blue);color:#fff;font-weight:800;font-size:11.5px;border-radius:999px;padding:4px 10px;min-width:64px;justify-content:center}
.qb svg{width:11px;height:11px}
.qb:active{background:var(--blue2);transform:scale(.97)}
.qb[disabled]{opacity:.5}
.empty{padding:40px 20px;text-align:center;color:var(--mut);font-size:12px}
/* cards / sections */
.sec{padding:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kv .v{font-weight:800;font-size:14px;margin-top:2px}
.h{display:flex;align-items:center;justify-content:space-between;margin:14px 12px 6px}
.h h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 12px;font-weight:800;font-size:12px;background:var(--panel2);border:1px solid var(--line2)}
.btn.red{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.45);color:var(--red)}
.btn.green{background:var(--green);color:#03140c;border-color:var(--green)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn[disabled]{opacity:.5}
/* positions table */
.pos{padding:10px 12px;border-bottom:1px solid var(--line)}
.pos .top1{display:flex;gap:9px;align-items:center}
.pos .logo{width:38px;height:38px;flex-basis:38px}
.pos .val{text-align:right}
.pos .val b{font-size:13.5px}
.pos .sells{display:flex;gap:6px;margin-top:8px}
.pos .sells button{flex:1;padding:7px 0;border-radius:7px;font-weight:800;font-size:12px;background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.35);color:var(--red)}
.pos .sells button:active{background:rgba(255,77,109,.25)}
.pos .meta{display:flex;gap:10px;font-size:10.5px;color:var(--mut);margin-top:6px;flex-wrap:wrap}
.pending{font-size:10px;color:var(--yellow);font-weight:700}
.thead{display:flex;padding:6px 12px;font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
/* history */
.hrow{display:flex;gap:9px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.hrow .logo{width:32px;height:32px;flex-basis:32px;font-size:12px}
.tag{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;background:#1a1c24;color:var(--mut)}
.tag.man{background:rgba(91,124,250,.18);color:#9fb2ff}
canvas{display:block;width:100%}
/* settings */
.set{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 12px 10px;overflow:hidden}
.set .t{padding:10px 12px 4px;font-size:10.5px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.srow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.srow:first-of-type{border-top:0}
.srow .lab{flex:1}
.srow .lab small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.tg{width:42px;height:24px;border-radius:999px;background:#2a2d39;position:relative;flex:0 0 42px;transition:.15s}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#9095a8;transition:.15s}
.tg.on{background:rgba(46,229,157,.3)}
.tg.on::after{left:21px;background:var(--green)}
.tg.lock{opacity:.6}
.num{width:76px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 8px;text-align:right;font-weight:700}
.segsm{display:flex;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.segsm button{padding:5px 9px;font-size:11.5px;font-weight:700;color:var(--mut)}
.segsm button.on{background:var(--blue);color:#fff}
.lockico{font-size:10px;color:var(--green);font-weight:800}
.savebar{position:sticky;bottom:calc(64px + var(--safe-b));margin:0 12px;padding:10px;background:rgba(13,14,19,.97);border:1px solid var(--line2);border-radius:12px;display:flex;gap:8px;z-index:12}
.savebar .btn{flex:1}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overflow-x:hidden;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 12px 10px;background:rgba(6,7,11,.97);border-bottom:1px solid var(--line)}
.back{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.back svg{width:16px;height:16px}
.dt-h .tk{font-size:15px}
.dt-price{font-size:20px;font-weight:800}
.tfs{display:flex;gap:4px;padding:8px 12px 0}
.tfs button{padding:4px 9px;border-radius:6px;font-size:11px;font-weight:700;color:var(--mut);background:var(--panel);border:1px solid var(--line)}
.tfs button.on{color:var(--txt);border-color:var(--line2)}
.chartbox{margin:8px 12px 0;border:1px solid var(--line);border-radius:10px;background:#08090d;height:240px;position:relative}
.chartbox canvas{height:240px}
.chartbox .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:10px 12px 0}
.stats>div{background:var(--panel);padding:8px}
.stats .k{font-size:9.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.stats .v{font-weight:800;font-size:12.5px;margin-top:2px}
.trade{margin:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bs{display:flex}
.bs button{flex:1;padding:10px 0;font-weight:800;color:var(--mut);border-bottom:2px solid transparent}
.bs button.on.b{color:var(--green);border-color:var(--green)}
.bs button.on.s{color:var(--red);border-color:var(--red)}
.tp{padding:12px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.presets button{padding:8px 0;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);font-weight:800;font-size:12px}
.presets button.on{border-color:var(--blue);color:#a9b8ff;background:rgba(91,124,250,.12)}
.amt{display:flex;align-items:center;gap:6px;margin-top:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:0 10px;height:40px}
.amt input{flex:1;background:none;border:0;outline:0;font-size:15px;font-weight:800;min-width:0}
.tinfo{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:8px}
.go{width:100%;margin-top:10px;padding:13px 0;border-radius:10px;font-weight:900;font-size:14px}
.go.b{background:var(--green);color:#03140c}
.go.s{background:var(--red);color:#fff}
.go[disabled]{opacity:.45}
.links{display:flex;gap:6px;padding:0 12px 16px;flex-wrap:wrap}
.links a{font-size:11px;font-weight:700;padding:6px 10px;border-radius:7px;background:var(--panel);border:1px solid var(--line);color:var(--mut)}
/* toast / modal */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));z-index:80;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
.tst{background:#151721;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .18s ease}
.tst.ok{border-color:rgba(46,229,157,.5)}.tst.err{border-color:rgba(255,77,109,.55)}.tst.info{border-color:rgba(91,124,250,.5)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.65);display:grid;place-items:end center}
.modal{width:min(560px,100%);background:var(--panel);border-top:1px solid var(--line2);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 14px;color:var(--mut);font-size:13px}
.modal .rb{display:flex;gap:8px}.modal .rb .btn{flex:1;padding:12px}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100;color:var(--mut);font-size:12px;transition:opacity .3s}
.boot.hide{opacity:0;pointer-events:none}
.banner{margin:8px 12px 0;padding:8px 10px;border-radius:8px;font-size:11.5px;font-weight:600}
.banner.warn{background:rgba(245,200,76,.1);border:1px solid rgba(245,200,76,.35);color:var(--yellow)}
.banner.err{background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.4);color:var(--red)}
.wallet-addr{font-family:ui-monospace,Menlo,monospace;font-weight:700}
/* column headers (desktop only) + side panel bits */
.colh{display:none}
.side{display:none}
.btn.sm{padding:5px 9px;font-size:11px}
.mini{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.mini .tk{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini:hover{background:var(--panel)}
.keys{margin:14px 12px 20px;padding:10px 12px;border:1px dashed var(--line2);border-radius:10px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;gap:5px}
.keys b{color:var(--txt);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
kbd{display:inline-block;min-width:18px;padding:1px 5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;background:var(--panel2);color:var(--txt);font:700 10.5px/1.4 ui-monospace,Menlo,monospace;text-align:center}
/* ---------------- desktop / PC (>=1024px) ---------------- */
@media (min-width:1024px){
  #app{max-width:none;margin:0;padding:0 380px 0 76px;min-height:100vh}
  nav.tabs{top:0;bottom:0;right:auto;width:76px;border-top:0;border-right:1px solid var(--line);padding:0;align-items:flex-start}
  nav.tabs .in{flex-direction:column;max-width:none;padding-top:14px;gap:4px}
  nav.tabs button{flex:none;padding:12px 0;font-size:10px}
  nav.tabs button.on{background:var(--panel)}
  nav.tabs button.on::before{top:20%;bottom:20%;left:0;right:auto;width:2px;height:auto}
  nav.tabs button:hover{color:var(--txt)}
  .top{padding:10px 18px}
  .bal-row{gap:28px}
  .seg{display:none}
  .toolbar{top:var(--toph,110px);padding:8px 18px}
  .toolbar .search{max-width:520px}
  .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;scroll-snap-type:none}
  .col{flex:none;max-width:none;min-height:calc(100vh - var(--toph,110px) - 50px);border-right:1px solid var(--line);overflow:clip}
  .col:last-child{border-right:0}
  .colh{display:flex;align-items:center;justify-content:space-between;position:sticky;top:calc(var(--toph,110px) + 49px);z-index:5;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:11.5px;font-weight:800;letter-spacing:.02em}
  .colh .n{color:var(--mut2);font-size:10.5px}
  .row:hover,.pos:hover{background:rgba(255,255,255,.025)}

function dataCandidates() {

    urls.push({ kind: "raw", url: `https://raw.githubusercontent.com/${m[1]}/${repo}/${DATA_BRANCH}/data.json` });
  }

}
async function fetchJson(url) {

}
let shaFails = 0;
async function loadData() {
  let lastErr;
  for (const c of dataCandidates()) {
    try {
      if (c.kind === "raw-sha") {
        if (shaFails > 3) continue;
        if (liveSource === "direct" && Date.now() - lastTickAt < 5000) continue; // live via MQTT: skip GitHub API (60/h limit)
        const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/commits?path=data.json&per_page=1&t=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) { shaFails++; throw new Error("sha"); }
        const arr = await r.json();

}

function drawEq(c, hist) {

  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);

  const X = t => (t - x0) / ((x1 - x0) || 1) * (w - 8) + 4, Y = v => h - 8 - (v - y0) / ((y1 - y0) || 1) * (h - 16);

  if (y0 < 0 && y1 > 0) { g.strokeStyle = "#262935"; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(w, Y(0)); g.stroke(); g.setLineDash([]); } const col = up ? "#2ee59d" : "#ff4d6d";
  g.beginPath(); P.forEach((p, i) => i ? g.lineTo(X(p[0]), Y(p[1])) : g.moveTo(X(p[0]), Y(p[1])));
  g.strokeStyle = col; g.lineWidth = 1.6; g.stroke();
  g.lineTo(X(x1), h); g.lineTo(X(x0), h); g.closePath();
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, up ? "rgba(46,229,157,.25)" : "rgba(255,77,109,.25)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fill();
}

async function saveSettings() {
  const patch = Object.assign({}, draft);
  if (patch.daily_limit_on === false && (D.settings || {}).daily_limit_on !== false) {
    if (!confirm("Tageslimit wirklich ausschalten? Dann kann der Bot an einem schlechten Tag mehr verlieren (Spielgeld).")) return;
  }
  try {
    const a = await sendCmd("set_settings", { settings: patch });
    if (a && a.ok === false) throw new Error(a.error);
    D.settings = Object.assign(D.settings || {}, patch, (a && a.settings) || {});
    draft = {}; settingsDirty = false; toast("Gespeichert.", "ok"); renderSet();
  } catch (e) { toast("Speichern fehlgeschlagen.", "err"); }
}

/* wallet (read-only: connect + balance; never signs) */
function phantomProvider() { const p = window.phantom && window.phantom.solana; if (p && p.connect) return p; const s = window.solana; return s && s.isPhantom && s.connect ? s : null; }
function solflareProvider() { const s = window.solflare || (window.solana && window.solana.isSolflare ? window.solana : null); return s && s.connect ? s : null; }
const isMobile = () => /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");
function walletHtml() {
  if (walletState.status === "connected") return `<div class="srow"><div class="lab"><span class="wallet-addr">${esc(walletState.address.slice(0, 4) + "…" + walletState.address.slice(-4))}</span><small>${walletState.balanceSol != null ? walletState.balanceSol.toFixed(4) + " SOL" : "Guthaben lädt…"} · nur Anzeige, der Bot handelt damit NICHT</small></div><button class="btn" id="w-off">Trennen</button></div>`;
  return `<div class="srow"><div class="lab">Wallet verbinden<small>Nur lesen (Adresse + Guthaben). Keine Signatur, kein echtes Trading.${walletState.error ? `<br><span class="down">${esc(walletState.error)}</span>` : ""}</small></div><button class="btn blue" id="w-on">Verbinden</button></div>`;
}
function bindWallet() { const a = $("#w-on"); if (a) a.onclick = connectWallet; const b = $("#w-off"); if (b) b.onclick = disconnectWallet; }
function pk(resp, p) { const k = (resp && resp.publicKey) || (p && p.publicKey); if (!k) return null; return typeof k === "string" ? k : (k.toBase58 ? k.toBase58() : String(k)); }
async function connectWallet() {
  const p = phantomProvider() || solflareProvider();
  if (!p) { if (isMobile()) { location.href = "https://phantom.app/ul/browse/" + encodeURIComponent(location.href) + "?ref=" + encodeURIComponent(location.origin); return; } walletState.error = "Kein Wallet gefunden (Phantom-Erweiterung oder Phantom-App nötig)."; renderSet(); return; }
  try { const r = await p.connect(); const a = pk(r, p); if (!a) throw new Error("Keine Adresse"); walletState = { status: "connected", address: a, balanceSol: null }; localStorage.setItem(WALLET_LS, JSON.stringify({ address: a })); renderSet(); refreshBal(); }
  catch (e) { walletState.error = e && e.code === 4001 ? "Abgebrochen." : "Verbindung fehlgeschlagen."; renderSet(); }
}
async function disconnectWallet() { try { const p = phantomProvider() || solflareProvider(); if (p && p.disconnect) await p.disconnect(); } catch (_) {} localStorage.removeItem(WALLET_LS); walletState = { status: "idle" }; if (tab === "set") renderSet(); }
async function refreshBal() {
  if (!walletState.address) return;
  for (const url of [SOLANA_RPC, SOLANA_RPC_FALLBACK]) {
    try { const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "getBalance", params: [walletState.address] }) }); const j = await r.json(); walletState.balanceSol = j.result.value / 1e9; break; } catch (_) {}
  }
  if (tab === "set" && !settingsDirty) renderSet();
}
async function silentWallet() { const p = phantomProvider() || solflareProvider(); if (!p || !localStorage.getItem(WALLET_LS)) return; try { const r = await p.connect({ onlyIfTrusted: true }); const a = pk(r, p); if (a) { walletState = { status: "connected", address: a, balanceSol: null }; refreshBal(); } } catch (_) {} }

    <div class="h"><h2>Letzte Trades</h2><button class="btn sm" data-goto-hist>Verlauf</button></div>
    <div id="side-cl"></div>
    <div class="keys"><b>Tastatur</b><span><kbd>1</kbd>–<kbd>4</kbd> Tabs</span><span><kbd>/</kbd> Suche</span><span><kbd>Shift</kbd>+<kbd>A</kbd> Auto-Trade</span><span><kbd>Esc</kbd> Schließen</span><span>Token offen: <kbd>B</kbd> Kaufen · <kbd>Q</kbd>/<kbd>W</kbd>/<kbd>E</kbd> Verkauf 25/50/100 %</span></div>`;
    $("#side-sell-all").onclick = sellAll;
  }
  setTxt("#side-n", `(${ps.length})`);
  $("#side-sell-all").disabled = !ps.length;
  syncList($("#side-pos"), ps, p => p.mint, posRow, `<div class="empty">Keine offenen Positionen.</div>`);
  const cl = (D.closed || []).slice(-8).reverse();
  syncList($("#side-cl"), cl, c => c.mint + (c.exit_time || ""), c => `<div class="mini" data-open="${esc(c.mint)}"><span class="tk">${esc(c.symbol)}</span><span class="${cls(c.pnl_usd)}">${pct(c.pnl_pct)}</span><b class="${cls(c.pnl_usd)}">${sgnUsd(c.pnl_usd)}</b></div>`, `<div class="empty">Noch keine Trades.</div>`);
  paintAges();
}
function onSideClick(e) {
  if (e.target.closest("[data-goto-hist]")) { setTab("hist"); return; }
  onListClick(e);
}
document.addEventListener("keydown", (e) => {
  const typing = e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable);
  if (e.key === "Escape") {
    if ($("#modal").innerHTML) { $("#modal").innerHTML = ""; return; }
    if (detail) { history.back(); return; }
    if (typing) e.target.blur();
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey || !D) return;
  const k = e.key;
  if (k === "A" && e.shiftKey) { e.preventDefault(); toggleAuto(); return; }
  if (detail) {
    const pos = (D.positions || []).find(p => p.mint === detail.mint);
    if (k === "b" || k === "B") { e.preventDefault(); if (!pos) quickBuy(detail, dtAmt); return; }
    const m = { q: 25, w: 50, e: 100 }[k.toLowerCase()];
    if (m && pos) { e.preventDefault(); sell(pos.mint, m, pos.symbol); return; }
    return;
  }
  const t = { "1": "pulse", "2": "pos", "3": "hist", "4": "set", "5": "ana", "6": "night", "7": "tweets" }[k];
  if (t) { e.preventDefault(); setTab(t); return; }
  if (k === "/") { e.preventDefault(); if (tab !== "pulse") setTab("pulse"); setTimeout(() => { const q = $("#q"); if (q) q.focus(); }, 0); }
});
WIDE_MQ.addEventListener("change", () => { document.body.classList.toggle("wide", isWide()); $("#view").innerHTML = ""; renderView(); renderSide(); });
document.body.classList.toggle("wide", isWide());

/* ---------------- tabs / render ---------------- */
function setTab(t) {
  tab = t; localStorage.setItem("ax_tab", t);
  document.querySelectorAll("nav.tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  $("#view").innerHTML = ""; window.scrollTo(0, 0);
  renderView();
}
function renderView() {
  if (!D) return;
  if (tab === "pulse") renderPulse();
  else if (tab === "pos") renderPos();
  else if (tab === "hist") renderHist();
  else if (tab === "ana") renderAna();
  else if (tab === "night") renderNight();
  else if (tab === "tweets") renderTweets();
  else if (tab === "set") { if (!settingsDirty || !$("#view").children.length) renderSet(); }
}
let liveRaf = 0;
function renderLive() {
  if (liveRaf) return;
  liveRaf = requestAnimationFrame(() => {
    liveRaf = 0;
    paintTop();
    renderSide();
    if (tab === "pulse") fillCols();
    else if (tab === "pos") renderPos();
    if (detail) updateDetailLive();
  });
}
async function tick() {
  try {
    const d = await loadData();
    const first = !D;
    mergeFull(d);
    connectLive();
    paintTop();
    if (first) { setTab(tab); hideBoot(); }
    else if (tab === "hist" || tab === "ana" || (tab === "set" && !settingsDirty)) renderView();
    else if (tab === "night" && document.activeElement && document.activeElement.id !== "nl-q") renderView();
    else if (tab === "tweets") renderView();
    else renderLive();
    renderSide();
  } catch (e) {
    if (!D) { hideBoot(); $("#view").innerHTML = `<div class="banner err">Daten konnten nicht geladen werden. Netz prüfen und neu laden.</div>`; }
  }
}
function hideBoot() { $("#boot").classList.add("hide"); document.body.dataset.ready = "true"; }

document.querySelectorAll("nav.tabs [data-tab]").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#auto-sw").onclick = toggleAuto;
$("#side").addEventListener("click", onSideClick);
(function boot() {
  const c = loadCache();
  if (c) {
    D = c; liveSource = "cache";
    try { connectLive(); paintTop(); setTab(tab); hideBoot(); renderSide(); } catch (_) {}
  }
  setTimeout(() => { firstPaintDone = true; }, 1500);
  const loop = async () => { await tick(); const live = liveSource === "direct" && Date.now() - lastTickAt < 5000; setTimeout(loop, tab === "ana" ? 10000 : tab === "night" || tab === "tweets" ? 3000 : live ? POLL_LIVE_MS : POLL_MS); };
  loop();
})();
silentWallet();
if ("serviceWorker" in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloading) return; reloading = true; location.reload(); });
  navigator.serviceWorker.register("./sw.js?v=22", { updateViaCache: "none" }).then(reg => { const ping = () => { try { reg.update(); } catch (_) {} }; ping(); setInterval(ping, 15000); if (reg.waiting) reg.waiting.postMessage("skipWaiting"); }).catch(() => {});
}

  </script>
