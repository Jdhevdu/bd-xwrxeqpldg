<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Grok Bot">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Grok Bot — FOMO TERMINAL</title>
  <style>
    :root {
      --red-deep: #000;
      --red: #111;
      --black: #000000;
      --card: #161616;
      --line: #262626;
      --text: #ffffff;
      --muted: #8E8E93;
      --green: #22F07A;
      --loss: #FF3B30;
      --blue: #0A84FF;
      --purple: #BF5AF2;
      --orange: #FF9F0A;
      --nav-h: 64px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: #000 fixed;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    body { max-width: 480px; margin: 0 auto; overflow-x: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    img { display: block; }

    #boot {
      position: fixed; inset: 0; z-index: 80;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #boot.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #boot .app-ico { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
    #boot h1 { margin: 18px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
    #boot .sub { margin-top: 4px; font-size: 11px; letter-spacing: .18em; color: var(--muted); font-weight: 600; }
    .spin {
      width: 22px; height: 22px; margin-top: 28px;
      border: 2px solid rgba(255,255,255,.18); border-top-color: #fff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    #boot .load-txt { margin-top: 10px; font-size: 13px; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }

    #app { padding: calc(10px + env(safe-area-inset-top)) 0 calc(var(--nav-h) + 12px + env(safe-area-inset-bottom)); }
    .top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
    .brand .ft { font-size: 9px; letter-spacing: .16em; color: var(--muted); font-weight: 700; margin-top: 2px; }
    .live {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .live .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--loss);
      box-shadow: 0 0 0 0 rgba(255,68,68,.7);
      animation: pulse 1.6s infinite;
    }
    .live.off .dot { background: var(--muted); animation: none; box-shadow: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,68,68,.7); }
      70% { box-shadow: 0 0 0 8px rgba(255,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(255,68,68,0); }
    }
    .appver { margin-left: 8px; opacity: .7; font-size: 9px; letter-spacing: .08em; }
    .eq-cash { font-size: 13px; color: #ffd0d0; font-weight: 600; margin-top: 4px; }
    .badge {
      margin: 0 16px 10px;
      display: inline-block;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      color: #ffd0d0;
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      padding: 4px 8px; border-radius: 999px;
    }
    .errb { margin: 0 16px 10px; background: rgba(255,68,68,.15); color: #ffc9c9; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
    .okb { margin: 0 16px 10px; background: rgba(74,222,128,.16); color: #bbf7d0; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
    .infob { margin: 0 16px 10px; background: rgba(251,191,36,.16); color: #fde68a; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }

    .ticker-wrap { overflow: hidden; margin: 0 0 8px; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
    .ticker { display: flex; gap: 10px; width: max-content; animation: tick 28s linear infinite; padding: 0 16px 6px; }
    .ticker:hover { animation-play-state: paused; }
    @keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .tick {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 12px 6px 6px; white-space: nowrap; font-size: 13px; font-weight: 650;
    }
    .av {
      width: 26px; height: 26px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff;
      background: #5a1010;
    }
    .av img { width: 100%; height: 100%; object-fit: cover; }
    .up { color: var(--green); } .down { color: var(--loss); }

    .pad { padding: 0 16px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 18px; padding: 14px; margin-bottom: 12px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    }
    .eq-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .k { font-size: 12px; color: var(--muted); font-weight: 600; }
    .mult {
      background: var(--green); color: #04150c; font-weight: 800; font-size: 13px;
      padding: 3px 9px; border-radius: 999px; letter-spacing: -.02em;
    }
    .eq-usd { font-size: 52px; font-weight: 800; letter-spacing: -2px; line-height: 1.02; margin: 2px 0 0; }
    .eq-usd.up { color: var(--green); }
    .eq-eur { font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
    .eq-pnl { margin-top: 8px; font-size: 16px; font-weight: 700; }
    .tf { display: flex; gap: 6px; margin: 10px 0 4px; align-items: center; }
    .tf button {
      flex: 1; text-align: center; font-size: 12px; font-weight: 800; letter-spacing: .02em;
      color: var(--green); padding: 6px 0; border-radius: 999px; opacity: .55;
    }
    .tf button.on { color: #04150c; background: var(--green); opacity: 1; font-weight: 800; }
    .chart-box { position: relative; height: 188px; margin: 0 -4px; overflow: visible; }
    .chart-box canvas { width: 100%; height: 100%; display: block; }
    .annos { position: absolute; inset: 0; pointer-events: none; font-size: 9px; font-weight: 700; }
    .anno {
      position: absolute; transform: translate(-50%, -120%);
      background: rgba(20,0,0,.82); border: 1px solid var(--line);
      padding: 2px 6px; border-radius: 8px; white-space: nowrap; color: #fff;
    }
    .empty-chart { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; padding: 16px; }

    .sec-h { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 8px; padding: 0 2px; }
    .sec-h h2 { margin: 0; font-size: 16px; font-weight: 800; }
    .sec-h .run { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--green); }
    .sec-h .run .g { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .sec-h .run.off { color: var(--muted); }
    .sec-h .run.off .g { background: var(--muted); }
    .see { font-size: 13px; color: var(--muted); font-weight: 600; }

    .agent { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .agent:last-child { border-bottom: 0; padding-bottom: 2px; }
    .agent .ico {
      width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
      background: rgba(255,255,255,.06); flex-shrink: 0;
    }
    .agent .mid { flex: 1; min-width: 0; }
    .agent .nm { font-size: 14px; font-weight: 700; }
    .agent .sub { font-size: 12px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; flex-shrink: 0; }
    .pill.blue { background: rgba(96,165,250,.16); color: var(--blue); }
    .pill.purple { background: rgba(192,132,252,.16); color: var(--purple); }
    .pill.green { background: rgba(74,222,128,.16); color: var(--green); }
    .pill.red { background: rgba(255,68,68,.16); color: var(--loss); }

    .act { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
    .act:last-child { border-bottom: 0; }
    .act .av, .tick .av { width: 36px; height: 36px; font-size: 13px; }
    .act .mid { flex: 1; min-width: 0; }
    .act .nm { font-size: 14px; font-weight: 700; }
    .act .sub { font-size: 12px; color: var(--muted); }
    .act .rhs { text-align: right; font-weight: 700; font-size: 13px; }
    .act .rhs .s { font-size: 11px; font-weight: 650; display: block; }
    .row-in { animation: rowin .35s ease; }
    @keyframes rowin { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    .nav {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 0; width: min(480px, 100%);
      display: flex; justify-content: space-around;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,.86); border-top: 1px solid var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 40;
    }
    .nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #636366; font-size: 10px; font-weight: 700; }
    .nav button.on { color: #fff; }
    .nav svg { width: 22px; height: 22px; }

    .view { display: none; }
    .view.on { display: block; }
    #detail {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: #000;
      overflow: auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      max-width: 480px; margin: 0 auto;
    }
    #detail.on { display: block; }
    .back { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #fff; }
    .tok-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .tok-h .av { width: 44px; height: 44px; font-size: 16px; }
    .tok-h .nm { font-size: 22px; font-weight: 800; }
    .tok-h .sp { margin-left: auto; display: flex; gap: 8px; }
    .tok-h .sp button { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.08); display: grid; place-items: center; }
    .mcap { font-size: 40px; font-weight: 800; letter-spacing: -1.4px; margin: 8px 0 2px; }
    .since { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .meta { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .stats .card { margin: 0; }
    .stats .v { font-size: 16px; font-weight: 800; margin-top: 2px; }
    .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; }
    .row .l { color: var(--muted); }
    .row .r { font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 8px 0 0; }
    .acct p { margin: 0 0 10px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .acct a { color: #ffb4b4; }
    .star.on { color: #fbbf24; }

    .pos { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
    .pos:last-child { border-bottom:0; }
    .pos .rhs { text-align:right; font-weight:800; font-size:13px; line-height:1.2; }
    .btn-sell, .btn-sell-all {
      font-size:12px; font-weight:800; padding:7px 11px; border-radius:999px;
      background:#fff; color:#8B0000; flex-shrink:0;
    }
    .btn-sell-all { background:rgba(255,255,255,.12); color:#fff; }
    .chips { display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto; }
    .chip {
      font-size:12px; font-weight:800; padding:6px 12px; border-radius:999px;
      background:rgba(255,255,255,.08); color:var(--muted); white-space:nowrap;
    }
    .chip.on { background:#fff; color:#8B0000; }
    .feed-item { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); text-align:left; width:100%; }
    .feed-item:last-child { border-bottom:0; }
    .feed-item .why { font-size:11px; color:var(--muted); margin-top:2px; }
    .dec { font-size:10px; font-weight:800; letter-spacing:.04em; padding:2px 7px; border-radius:999px; flex-shrink:0; text-transform:uppercase; }
    .dec.seen { background:rgba(96,165,250,.16); color:var(--blue); }
    .dec.accepted, .dec.bought { background:rgba(74,222,128,.16); color:var(--green); }
    .dec.rejected, .dec.skipped { background:rgba(255,68,68,.16); color:var(--loss); }
    .nav button { font-size:9px; }

    .ctrl {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
    }
    .ctrl .st { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
    .ctrl .st .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 0 3px rgba(74,222,128,.18);
    }
    .ctrl .st.paused .dot { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.2); }
    .ctrl .st.off .dot { background: var(--muted); box-shadow: none; }
    .btn-ctrl {
      font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 999px;
      background: #fff; color: #04150c; letter-spacing: -.01em;
    }
    .btn-ctrl.start { background: var(--green); color: #052e16; }
    .btn-ctrl:disabled { opacity: .55; }
    .tag-pf {
      display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 800;
      letter-spacing: .04em; padding: 1px 6px; border-radius: 999px;
      background: #fff; color: #b91c1c; vertical-align: middle;
    }
    .tag-pf.tag-grad { background: #3a2a00; color: #ffd36a; }
    .tag-pf.tag-sm { background: #06281a; color: #86efac; }
    .tag-pf.tag-nar { background: #1e1530; color: #d8b4fe; }
    .tag-pf.tag-bundle { background: #3a0000; color: #fda4af; }
    .learn-lesson { font-size: 14px; line-height: 1.45; color: #fff; margin: 0 0 10px; }
    .live.paused { color: #fbbf24; }
    .live.paused .dot { background: #fbbf24; }
    .modal-bg {
      position: fixed; inset: 0; z-index: 90;
      background: rgba(0,0,0,.62);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    }
    .modal {
      width: 100%; max-width: 440px;
      background: #1c1c1e; border: 1px solid var(--line);
      border-radius: 20px; padding: 18px 16px 16px;
    }
    .modal h3 { margin: 0 0 8px; font-size: 18px; font-weight: 800; }
    .modal p { margin: 0 0 16px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .modal .rowbtns { display: flex; gap: 8px; }
    .modal .rowbtns button { flex: 1; padding: 12px; border-radius: 12px; font-weight: 800; }
    .modal .cancel { background: rgba(255,255,255,.08); color: #fff; }
    .modal .ok { background: var(--green); color: #04150c; }
    .wallet-box {
      margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    }
    .wallet-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .wallet-addr { font-size: 16px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .wallet-bal { font-size: 13px; color: #ffd0d0; font-weight: 600; margin-top: 2px; }
    .wallet-note { margin: 10px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; font-weight: 600; }
    .wallet-alt { margin-top: 8px; font-size: 12px; font-weight: 700; color: #ffb4b4; }
    .wallet-err { margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--loss); }
    .btn-wallet {
      font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: 999px;
      background: #fff; color: #04150c; letter-spacing: -.01em; white-space: nowrap;
    }
    .btn-wallet:disabled { opacity: .55; }
    .btn-wallet-off {
      font-size: 12px; font-weight: 800; padding: 7px 11px; border-radius: 999px;
      background: rgba(255,255,255,.12); color: #fff; flex-shrink: 0;
    }
    .wallet-deep { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .wallet-deep a { color: #ffb4b4; font-size: 12px; font-weight: 700; }
    .set-card .k { margin-bottom: 8px; }
    .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .set-row:last-child { border-bottom: 0; }
    .set-row .l { color: var(--muted); font-size: 13px; font-weight: 600; flex: 1; }
    .set-row .nm { font-size: 14px; font-weight: 700; }
    .set-row .sub { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 600; }
    .pump-sc { display:inline-flex; align-items:center; margin-left:6px; font-size:11px; font-weight:800; padding:2px 7px; border-radius:999px; background:rgba(255,180,180,.16); color:#ffd0d0; vertical-align:middle; }
    .pump-sc.hot { background:rgba(80,220,140,.22); color:#9dffc2; }
    .pump-sc.warm { background:rgba(255,200,80,.2); color:#ffe08a; }
    .pump-why { font-size:11px; color:var(--muted); font-weight:600; margin-top:1px; }
    .radar-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); width:100%; text-align:left; background:none; color:inherit; }
    .radar-row:last-child { border-bottom:0; }
    .radar-sc { font-size:16px; font-weight:800; min-width:36px; text-align:right; font-variant-numeric:tabular-nums; color:#ffd0d0; }
    .radar-sc.hot { color:#9dffc2; }
    .radar-sc.warm { color:#ffe08a; }
    .set-num { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 13px; }
    .set-num input {
      width: 76px; text-align: right; font: inherit; font-weight: 800; color: #fff;
      background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 10px;
      padding: 7px 8px;
    }
    .sw {
      width: 46px; height: 28px; border-radius: 999px; flex-shrink: 0;
      background: rgba(255,255,255,.14); position: relative;
    }
    .sw::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 22px; height: 22px; border-radius: 50%; background: #fff;
      transition: transform .18s ease;
    }
    .sw.on { background: var(--green); }
    .sw.on::after { transform: translateX(18px); }
    .set-warn { margin: 8px 0 0; font-size: 12px; font-weight: 700; color: #fde68a; line-height: 1.4; }
    .btn-save {
      width: 100%; margin: 4px 0 8px; padding: 13px; border-radius: 14px;
      background: #fff; color: #04150c; font-weight: 800; font-size: 15px;
    }
    .btn-save:disabled { opacity: .55; }
    .btn-ghost {
      width: 100%; margin: 0 0 8px; padding: 12px; border-radius: 14px;
      background: rgba(255,255,255,.1); color: #fff; font-weight: 800; font-size: 13px;
    }
    .set-seg { margin: 8px 0 4px; }
    .always { font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 999px;
      background: rgba(74,222,128,.16); color: var(--green); flex-shrink: 0; }

    /* TikTok-reference chrome */
    .top { padding: 8px 16px 4px; }
    .brand img { width: 28px; height: 28px; border-radius: 50%; }
    .brand h1 { font-size: 17px; font-weight: 700; }
    .brand .chev { color: var(--muted); font-weight: 500; }
    .top-actions { display:flex; gap: 4px; }
    .top-actions button {
      width: 36px; height: 36px; border-radius: 50%; display:grid; place-items:center;
      color: #fff;
    }
    .top-actions svg { width: 22px; height: 22px; }

    .ag-scroller {

    .ag-card {

    .ag-card .hd { display:flex; align-items:center; gap:8px; }

    .ag-speed .rows div, .speed-strip div {

    .ag-speed .rows b, .speed-strip b { color:#fff; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 800; }
    .speed-strip {

    .speed-strip .hd { grid-column: 1 / -1; font-size: 12px; font-weight: 800; color:#fff; letter-spacing:.02em; }

    .ag-fil { display:flex; gap:6px; align-items:center; font-size: 11px; padding: 3px 0; }

      width:100%; background:transparent; border:0; color:#fff; font: inherit; font-weight:700; outline:none;

  </style>
</head>
<body>
  <div id="boot">
    <img class="app-ico" src="icon-192.png" alt="">
    <h1>Grok Bot</h1>
    <div class="sub">FOMO TERMINAL</div>
    <div class="spin"></div>
    <div class="load-txt">Loading trade feed</div>
  </div>

  <div id="app" hidden>
    <div class="top">
      <div class="brand">
        <img src="icon-192.png" alt="">
        <h1>Grok Bot <span class="chev">›</span></h1>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-search" aria-label="Suche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16.5 16.5 21 21"/></svg>
        </button>
        <button type="button" id="btn-bell" aria-label="Mitteilungen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
        </button>
      </div>
    </div>
    <div id="livepill" class="live" hidden><span class="dot"></span> Live</div>
    <div class="search-box" id="search-box"><input id="search-inp" type="search" placeholder="Coin suchen…" autocomplete="off"></div>
    <div class="paper-mini">Spielgeld · <span class="appver" id="appver">v16</span></div>
    <div id="banners"></div>
    <canvas id="confetti"></canvas>

    <div id="view-home" class="view on"></div>
    <div id="view-feed" class="view"></div>
    <div id="view-agents" class="view pad"></div>
    <div id="view-activity" class="view pad"></div>
    <div id="view-account" class="view pad"></div>
    <div id="view-settings" class="view pad"></div>
  </div>

  <div id="detail"></div>
  <div id="modal-root"></div>

  <nav class="nav" id="nav">
    <button data-tab="home" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
      Home
    </button>
    <button data-tab="agents">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><circle cx="12" cy="16.5" r="2.6"/></svg>
      Agents
    </button>
    <button data-tab="activity">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v10l4 2M12 8v8M20 4v10"/></svg>
      Activity
    </button>
    <button data-tab="account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.5-3.2 4-5 7-5s5.5 1.8 7 5"/></svg>
      Account
    </button>
  </nav>

  <script>
  const POLL_MS = 8000;
  const APP_VERSION = "v16";
  const DATA_BRANCH = "main";
  const bootAt = Date.now();
  let lastData = null;
  let feedFilter = "all";
  let feedItems = [];
  let tab = "home";
  let tf = "LIVE";
  let knownActs = new Set();
  let firstPaint = true;
  let favs = new Set(JSON.parse(localStorage.getItem("fomo_favs") || "[]"));

  const $ = (s, el=document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const de = (n, d=2) => (n==null || Number.isNaN(+n)) ? "—" : Number(n).toLocaleString("en-US", {minimumFractionDigits:d, maximumFractionDigits:d});
  const solAmt = (v) => (v==null || Number.isNaN(+v)) ? "—" : (Number(v).toLocaleString("de-DE", { minimumFractionDigits: 4, maximumFractionDigits: 6 }) + " SOL");
  const usd = (n, d=2) => (n==null || Number.isNaN(+n)) ? "—" : (Number(n)<0?"-":"") + "$" + de(Math.abs(n), d);
  const eur = (n, d=2) => (n==null || Number.isNaN(+n)) ? "—" : de(n, d) + " €";
  const pct = (n, already=false) => {
    if (n==null || Number.isNaN(+n)) return "—";
    const v = already ? Number(n) : Number(n)*100;
    return (v>0?"+":"") + de(v, 2) + "%";
  };
  const cls = (n) => Number(n) >= 0 ? "up" : "down";
  const arrow = (n) => Number(n) >= 0 ? "▲" : "▼";
  const clock = (ts) => {
    if (!ts) return "—";
    const m = String(ts).match(/(\d{2}:\d{2})/);
    return m ? m[1] : esc(ts);
  };
  const hue = (s) => {
    let h = 0;
    for (const c of String(s||"")) h = (h*31 + c.charCodeAt(0)) >>> 0;
    return h % 360;
  };
  function avatar(url, symbol, size) {
    const init = esc((symbol||"?").slice(0,1).toUpperCase());
    const bg = `hsl(${hue(symbol)} 45% 32%)`;
    const src = url ? `<img src="${esc(url)}" alt="" onerror="this.remove()">` : "";
    return `<div class="av" style="background:${bg}${size?`;width:${size}px;height:${size}px`:""}">${src}${init}</div>`;
  }
  function dataCandidates() {
    const urls = [];
    const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
    const parts = location.pathname.split("/").filter((x) => x && x !== "index.html");
    const repo = parts[0] || "";
    if (m && repo) {
      urls.push({ kind: "raw-sha", owner: m[1], repo });
      urls.push({ kind: "raw", url: `https://raw.githubusercontent.com/${m[1]}/${repo}/${DATA_BRANCH}/data.json` });
    }
    urls.push({ kind: "local", url: "data.json" });
    return urls;
  }
  async function fetchJson(url) {
    const sep = url.includes("?") ? "&" : "?";
    const r = await fetch(url + sep + "t=" + Date.now(), { cache: "no-store", mode: "cors" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function latestDataSha(owner, repo) {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=data.json&per_page=1&t=${Date.now()}`, {
      cache: "no-store", headers: { Accept: "application/vnd.github+json" }
    });
    if (!r.ok) throw new Error("sha HTTP " + r.status);
    const arr = await r.json();
    const sha = arr && arr[0] && arr[0].sha;
    if (!sha) throw new Error("no sha");
    return sha;
  }
  async function loadData() {
    let lastErr;
    for (const c of dataCandidates()) {
      try {
        if (c.kind === "raw-sha") {
          const sha = await latestDataSha(c.owner, c.repo);
          return await fetchJson(`https://raw.githubusercontent.com/${c.owner}/${c.repo}/${sha}/data.json`);
        }
        return await fetchJson(c.url);
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error("no data");
  }

  function hideBoot() {
    const wait = Math.max(0, 1100 - (Date.now() - bootAt));
    setTimeout(() => { $("#boot").classList.add("hide"); $("#app").hidden = false; document.body.dataset.ready = "true"; }, wait);
  }

  function filterHistory(hist, key) {
    if (!hist || !hist.length) return [];
    const now = Date.now() / 1000;
    if (key === "LIVE") {
      const start = (lastData && lastData.started_ts) ? Number(lastData.started_ts) : now - 6*3600;
      const from = Math.min(start, now - 30*60);
      const out = hist.filter(p => (p.t || 0) >= from - 5);
      return out.length ? out : hist.slice();
    }
    const span = { "1H": 3600, "4H": 4*3600, "1D": 86400, "1W": 7*86400, ALL: Infinity }[key] || Infinity;
    if (!isFinite(span)) return hist.slice();
    const cut = now - span;
    const out = hist.filter(p => (p.t || 0) >= cut);
    if (out.length < 2) {
      const older = hist.filter(p => (p.t || 0) < cut);
      if (older.length) return [older[older.length-1], ...out];
    }
    return out;
  }


  function drawEquity(canvas, points, events) {
    const wrap = canvas.parentElement;
    if (!wrap) return;
    [...wrap.querySelectorAll(".annos, .empty-chart")].forEach(n => n.remove());
    const w = canvas.clientWidth, h = canvas.clientHeight, r = window.devicePixelRatio || 1;
    if (w < 8 || h < 8) {
      requestAnimationFrame(() => drawEquity(canvas, points, events));
      return;
    }
    canvas.width = w * r; canvas.height = h * r;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!points || points.length < 1) {
      wrap.insertAdjacentHTML("beforeend", `<div class="empty-chart">Noch wenig Verlauf — der Bot zeichnet ab jetzt jede Änderung auf.</div>`);
      return;
    }
    const vals = points.map(p => p.usd);
    let min = Math.min(...vals), max = Math.max(...vals);
    if (max === min) { min -= 0.2; max += 0.2; }
    const padL = 4, padR = 10, padT = 28, padB = 10;
    const xOf = (i) => padL + (w - padL - padR) * (points.length === 1 ? 1 : i / (points.length - 1));
    const yOf = (v) => padT + (h - padT - padB) * (1 - (v - min) / (max - min));
    const path = new Path2D();
    points.forEach((pt, i) => {
      const x = xOf(i), y = yOf(pt.usd);
      if (i === 0) path.moveTo(x, y); else path.lineTo(x, y);
    });
    const fill = new Path2D(path);
    fill.lineTo(xOf(points.length-1), h - padB);
    fill.lineTo(xOf(0), h - padB);
    fill.closePath();
    const g = ctx.createLinearGradient(0, padT, 0, h);
    g.addColorStop(0, "rgba(34,240,122,.35)");
    g.addColorStop(1, "rgba(34,240,122,0)");
    ctx.fillStyle = g;
    ctx.fill(fill);
    ctx.strokeStyle = "#22F07A";
    ctx.lineWidth = 2.6;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke(path);
    // end dot
    const lx = xOf(points.length-1), ly = yOf(points[points.length-1].usd);
    ctx.fillStyle = "#22F07A";
    ctx.beginPath(); ctx.arc(lx, ly, 4.2, 0, Math.PI*2); ctx.fill();

    const annos = document.createElement("div");
    annos.className = "annos";
    const t0 = points[0].t, t1 = points[points.length-1].t || t0+1;
    const closes = (events || []).filter(ev => ev && ev.ts && ev.kind && ev.kind !== "Bought" && ev.kind !== "Pending");
    closes.forEach(ev => {
      const tm = ev.ts;
      if (tm < t0 - 60 || tm > t1 + 60) return;
      const x = padL + (w - padL - padR) * ((tm - t0) / (t1 - t0 || 1));
      let y = yOf(points[points.length-1].usd);
      for (let i = 1; i < points.length; i++) {
        if (tm <= (points[i].t || 0)) {
          const a = points[i-1], b = points[i];
          const u = (tm - a.t) / (b.t - a.t || 1);
          y = yOf(a.usd + (b.usd - a.usd) * u);
          break;
        }
      }
      const win = ev.pnl_usd == null ? ev.kind !== "Stopped" : ev.pnl_usd >= 0;
      let label;
      if (!win && ev.kind && /Stop/i.test(ev.kind)) {
        const pnl = ev.pnl_usd != null ? usd(ev.pnl_usd) : "";
        label = `−6%${pnl ? " · " + (ev.pnl_usd>=0?"+":"") + pnl : ""}`;
      } else if (ev.pnl_usd != null) {
        label = (ev.pnl_usd>=0?"+":"") + usd(Math.abs(ev.pnl_usd)).replace("$-","-$");
        // usd() already has $
        label = (ev.pnl_usd>=0?"+":"-") + usd(Math.abs(ev.pnl_usd));
      } else {
        label = ev.title || ev.kind;
      }
      const el = document.createElement("div");
      el.className = "anno pill " + (win ? "win" : "lose");
      el.style.left = `${Math.max(36, Math.min(w-36, x))}px`;
      el.style.top = `${Math.max(18, Math.min(h-14, y))}px`;
      const img = ev.image_url ? `<img src="${esc(ev.image_url)}" alt="" onerror="this.style.display='none'">` : "";
      el.innerHTML = `<span class="av">${img}${esc((ev.symbol||"").slice(0,2))}</span>${esc(label)}`;
      annos.appendChild(el);
    });
    wrap.appendChild(annos);
  }

  function tickerHtml(positions) {
    if (!positions.length) return "";
    const item = (p) => `<button class="tick" data-open="${esc(p.symbol)}">${avatar(p.image_url, p.symbol)}${esc(p.symbol)}${pumpTag(p)} <span class="${cls(p.pnl_usd != null ? p.pnl_usd : p.pnl_pct)}">${p.pnl_usd!=null?((p.pnl_usd>=0?"+":"")+usd(p.pnl_usd)+" "):""}${arrow(p.pnl_pct)} ${pct(p.pnl_pct)}</span></button>`;
    const row = positions.map(item).join("");
    const copies = positions.length < 3 ? row + row + row + row : row + row;
    return `<div class="ticker-wrap"><div class="ticker">${copies}</div></div>`;
  }

  function ico(name) {
    const svgs = {
      scan: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>`,

  function fmtMcap(n) {
    if (n==null || Number.isNaN(+n)) return "—";

    if (v >= 1e9) return "$" + de(v/1e9, 2) + "B";
    if (v >= 1e6) return "$" + de(v/1e6, 2) + "M";
    if (v >= 1e3) return "$" + de(v/1e3, 2) + "K";
    return usd(v, 0);
  }
  function ageLabel(iso) {
    if (!iso) return null;

    if (d < 1) return Math.max(1, Math.round(d*24)) + "h old";
    return de(d, d < 10 ? 1 : 0) + "d old";
  }

  async function loadTokenMarket(p) {
    const pool = p.pool;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    if (!pool) { set("dt-mcap", p.current_price!=null?usd(p.current_price, p.current_price<0.01?8:4):"—"); return; }
    try {
      const r = await fetch(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${encodeURIComponent(pool)}`, { cache: "no-store" });
      if (r.ok) {
        const j = await r.json();
        const a = (j.data && j.data.attributes) || {};
        const mc = parseFloat(a.market_cap_usd || a.fdv_usd);
        const vol = a.volume_usd && (a.volume_usd.h24 || a.volume_usd.h1);
        const liq = parseFloat(a.reserve_in_usd);
        const age = ageLabel(a.pool_created_at);
        const px = parseFloat(a.base_token_price_usd);
        if (px) set("dt-mcap", usd(px, px<0.01?8:4));
        set("st-mcap", fmtMcap(mc));
        if (!Number.isNaN(liq)) set("st-liq", fmtMcap(liq));
        set("st-vol", vol ? fmtMcap(parseFloat(vol)) : "—");
        const meta = document.getElementById("dt-meta");
        if (meta) meta.textContent = `${p.symbol} · Solana${age ? " · " + age : ""}`;
      }
    } catch {}
    if (p.mint) {
      try {
        const r = await fetch(`https://api.rugcheck.xyz/v1/tokens/${encodeURIComponent(p.mint)}/report`, { cache: "no-store" });
        if (r.ok) {
          const j = await r.json();
          const n = j.totalHolders || j.holders || (j.tokenMeta && j.tokenMeta.holders);
          if (n) set("st-hold", Number(n).toLocaleString("en-US"));
        }
      } catch {}
    }
    let candles = [];
    for (const path of [
      `ohlcv/minute?aggregate=5&limit=120`,
      `ohlcv/hour?aggregate=1&limit=72`
    ]) {
      try {
        const r = await fetch(`https://api.geckoterminal.com/api/v2/networks/solana/pools/${encodeURIComponent(pool)}/${path}`, { cache: "no-store" });
        if (!r.ok) continue;
        const j = await r.json();
        const list = (((j.data||{}).attributes)||{}).ohlcv_list || [];
        if (list.length) { candles = list.slice().reverse(); break; }
      } catch {}
    }
    drawCandles($("#candle"), candles, p.entry_price, p.current_price, p._trailPx);
  }

  function drawCandles(canvas, rows, entry, current, trail) {
    if (!canvas) return;
    const wrap = canvas.parentElement;
    wrap.querySelectorAll(".empty-chart, .line-tag").forEach(n => n.remove());
    const w = canvas.clientWidth, h = canvas.clientHeight, r = window.devicePixelRatio || 1;
    canvas.width = w * r; canvas.height = h * r;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(r, 0, 0, r, 0, 0);
    ctx.clearRect(0, 0, w, h);
    if (!rows.length) {
      if (entry && current) {
        drawEquity(canvas, [{t:0,usd:entry},{t:1,usd:current}], []);
        return;
      }
      wrap.insertAdjacentHTML("beforeend", `<div class="empty-chart">Kein Chart verfügbar.</div>`);
      return;
    }
    const padT = 18, padB = 32, padL = 2, padR = 2;
    const chartH = h - padT - padB;
    let lo = Math.min(...rows.map(x => x[3])), hi = Math.max(...rows.map(x => x[2]));
    if (entry) { lo = Math.min(lo, entry); hi = Math.max(hi, entry); }
    if (current) { lo = Math.min(lo, current); hi = Math.max(hi, current); }
    if (trail) { lo = Math.min(lo, trail); hi = Math.max(hi, trail); }
    if (hi === lo) { hi += hi*0.01; lo -= lo*0.01; }
    const yOf = (v) => padT + chartH * (1 - (v - lo) / (hi - lo));
    const maxV = Math.max(...rows.map(x => x[5] || 0), 1);
    const slot = (w - padL - padR) / rows.length;
    const cw = Math.max(1, slot * 0.62);
    rows.forEach((c, i) => {
      const x = padL + i * slot + slot/2;
      const vh = (c[5] / maxV) * (padB - 6);
      ctx.fillStyle = c[4] >= c[1] ? "rgba(34,240,122,.4)" : "rgba(255,59,48,.4)";
      ctx.fillRect(x - cw/2, h - 2 - vh, cw, vh);
    });
    const dash = (y, color) => {
      ctx.setLineDash([5,5]); ctx.strokeStyle = color; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w-padR, y); ctx.stroke();
      ctx.setLineDash([]);
    };
    const tag = (y, cls, text, right) => {
      const el = document.createElement("div");
      el.className = "line-tag " + cls;
      el.textContent = text;
      el.style.top = Math.max(0, y - 8) + "px";
      el.style[right ? "right" : "left"] = "4px";
      wrap.appendChild(el);
    };
    if (trail) { dash(yOf(trail), "#FF9F0A"); tag(yOf(trail), "trail", "Risk trailing stop"); }
    if (current) { dash(yOf(current), "#22F07A"); tag(yOf(current), "cur", (current<0.01?current.toPrecision(4):current.toFixed(4)), true); }
    if (entry) { dash(yOf(entry), "#0A84FF"); tag(yOf(entry), "buy", "Executor buy"); }
    rows.forEach((c, i) => {
      const x = padL + i * slot + slot/2;
      const up = c[4] >= c[1];
      ctx.strokeStyle = ctx.fillStyle = up ? "#22F07A" : "#FF3B30";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, yOf(c[2])); ctx.lineTo(x, yOf(c[3])); ctx.stroke();
      const yb = yOf(Math.max(c[1], c[4])), yt = yOf(Math.min(c[1], c[4]));
      ctx.fillRect(x - cw/2, yb, cw, Math.max(1, yt - yb));
    });
  }

  const WALLET_LS = "fomo_wallet_v1";
  const SOLANA_RPC = "https://api.mainnet-beta.solana.com";
  const SOLANA_RPC_FALLBACK = "https://solana-rpc.publicnode.com";
  const WALLET_NOTICE = "Nur verbunden – der Bot handelt weiter mit Spielgeld. Bitte eine separate Bot-Wallet verwenden, nicht die Haupt-Wallet.";
  let walletState = {
    status: "idle",
    address: null,
    providerName: null,
    balanceSol: null,
    balanceErr: false,
    error: null
  };
  let walletBusy = false;
  let walletBalanceAt = 0;

  function shortAddr(a) {
    const s = String(a || "");
    if (s.length < 10) return s || "—";
    return s.slice(0, 4) + "…" + s.slice(-4);
  }
  function loadWalletLs() {
    try { return JSON.parse(localStorage.getItem(WALLET_LS) || "null"); }
    catch (_) { return null; }
  }
  function saveWalletLs(addr, name) {
    try { localStorage.setItem(WALLET_LS, JSON.stringify({ address: addr, provider: name || "phantom" })); }
    catch (_) {}
  }
  function clearWalletLs() {
    try { localStorage.removeItem(WALLET_LS); } catch (_) {}
  }
  function phantomProvider() {
    const injected = window.phantom && window.phantom.solana;
    if (injected && typeof injected.connect === "function") return injected;
    const s = window.solana;
    if (s && typeof s.connect === "function" && s.isPhantom) return s;
    return null;
  }
  function solflareProvider() {
    const s = window.solflare || (window.solana && window.solana.isSolflare ? window.solana : null);
    if (s && typeof s.connect === "function") return s;
    return null;
  }
  function hasInjectedWallet() { return !!(phantomProvider() || solflareProvider()); }
  function isMobileUa() { return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || ""); }
  function appBrowseUrl() { return location.origin + location.pathname + location.search; }
  function phantomBrowseLink() {
    return "https://phantom.app/ul/browse/" + encodeURIComponent(appBrowseUrl()) + "?ref=" + encodeURIComponent(location.origin);
  }
  function solflareBrowseLink() {
    return "https://solflare.com/ul/v1/browse/" + encodeURIComponent(appBrowseUrl()) + "?ref=" + encodeURIComponent(location.origin);
  }
  function pubkeyOf(resp, provider) {
    const pk = (resp && resp.publicKey) || (provider && provider.publicKey);
    if (!pk) return null;
    if (typeof pk === "string") return pk;
    try { if (typeof pk.toBase58 === "function") return pk.toBase58(); } catch (_) {}
    try { if (typeof pk.toString === "function") return pk.toString(); } catch (_) {}
    return null;
  }

  function walletHtml() {
    const note = `<p class="wallet-note">${esc(WALLET_NOTICE)}</p>`;
    if (walletState.status === "connected" && walletState.address) {
      const bal = walletState.balanceSol != null
        ? solAmt(walletState.balanceSol)
        : (walletState.balanceErr ? "Guthaben nicht verfügbar" : "Guthaben wird geladen…");
      const who = walletState.providerName === "solflare" ? "Solflare" : "Phantom";

          <div>
            <div class="k">Verbunden · ${esc(who)}</div>

            <div class="wallet-bal" id="wallet-bal">${esc(bal)}</div>
          </div>
          <button class="btn-wallet-off" type="button" id="btn-wallet-disconnect">Trennen</button>
        </div>
        ${note}
      </div>`;
    }
    const err = walletState.error ? `<div class="wallet-err">${esc(walletState.error)}</div>` : "";
    const needDeep = !hasInjectedWallet();
    const deep = needDeep ? `<div class="wallet-alt">${isMobileUa()
      ? "Kein Wallet im Browser. Tippe auf „Wallet verbinden“, um die Seite in der Phantom-App zu öffnen."
      : "Kein Wallet gefunden. Bitte die Phantom-Erweiterung installieren oder die Seite in der Phantom-App öffnen (nur über HTTPS)."}</div>
      ${isMobileUa() ? `<div class="wallet-deep"><a href="${esc(solflareBrowseLink())}">Oder in Solflare öffnen</a></div>` : ""}` : "";
    const label = walletState.status === "connecting" ? "Verbinden…" : "Wallet verbinden";
    return `<div class="wallet-box" id="wallet-box">
      <div class="wallet-row">
        <div class="k">Wallet</div>
        <button class="btn-wallet" type="button" id="btn-wallet-connect"${walletState.status==="connecting"?" disabled":""}>${label}</button>
      </div>
      ${deep}${err}${note}
    </div>`;
  }

  function bindWallet() {
    const c = document.getElementById("btn-wallet-connect");
    if (c) c.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); connectWallet(); };
    const d = document.getElementById("btn-wallet-disconnect");
    if (d) d.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); disconnectWallet(); };
  }

  async function connectWallet() {
    if (walletBusy) return;
    const ph = phantomProvider();
    const sf = solflareProvider();
    if (!ph && !sf) {
      if (isMobileUa()) {
        location.href = phantomBrowseLink();
        return;
      }
      walletState.error = "Kein Wallet gefunden. Phantom unter https://phantom.app installieren und die Seite über HTTPS öffnen.";
      if (lastData) { renderHome(lastData); bindHome(); }
      return;
    }
    walletBusy = true;
    walletState.status = "connecting";
    walletState.error = null;
    if (lastData) { renderHome(lastData); bindHome(); }
    try {
      const provider = ph || sf;
      const name = ph ? "phantom" : "solflare";
      const resp = await provider.connect();
      const addr = pubkeyOf(resp, provider);
      if (!addr) throw new Error("Keine Adresse erhalten");
      await setConnected(addr, name, provider);
    } catch (e) {
      walletState.status = "idle";
      walletState.error = (e && (e.code === 4001 || e.code === "4001"))
        ? "Verbindung abgebrochen."
        : ((e && e.message) ? String(e.message) : "Verbindung fehlgeschlagen.");
      if (lastData) { renderHome(lastData); bindHome(); }
    } finally {
      walletBusy = false;
    }
  }

  async function setConnected(addr, name, provider) {
    walletState.status = "connected";
    walletState.address = addr;
    walletState.providerName = name;
    walletState.error = null;
    walletState.balanceErr = false;
    if (walletState.balanceSol == null) walletBalanceAt = 0;
    saveWalletLs(addr, name);
    bindProviderEvents(provider);
    if (lastData) { renderHome(lastData); bindHome(); }
    else {
      const box = document.getElementById("wallet-box");
      if (box) { /* home not painted yet */ }
    }
    await refreshBalance(true);
  }

  async function silentReconnect() {
    const ph = phantomProvider();
    const sf = solflareProvider();
    const saved = loadWalletLs();
    const prefer = (saved && saved.provider === "solflare") ? (sf || ph) : (ph || sf);
    if (!prefer) return;
    try {
      const resp = await prefer.connect({ onlyIfTrusted: true });
      const addr = pubkeyOf(resp, prefer);
      if (!addr) return;
      const name = (prefer.isSolflare && !prefer.isPhantom) ? "solflare" : "phantom";
      await setConnected(addr, name, prefer);
    } catch (_) {}
  }

  async function disconnectWallet() {
    const ph = phantomProvider();
    const sf = solflareProvider();
    try { if (ph && typeof ph.disconnect === "function") await ph.disconnect(); } catch (_) {}
    try { if (sf && typeof sf.disconnect === "function") await sf.disconnect(); } catch (_) {}
    clearWalletLs();
    walletState = { status: "idle", address: null, providerName: null, balanceSol: null, balanceErr: false, error: null };
    if (lastData) { renderHome(lastData); bindHome(); }
  }

  async function rpcGetBalance(addr, url) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jsonrpc: "2.0", id: 1, method: "getBalance", params: [addr] }),
      cache: "no-store"
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const lamports = data && data.result && data.result.value;
    if (typeof lamports !== "number") throw new Error("bad rpc");
    return lamports / 1e9;
  }

  async function refreshBalance(force) {
    const addr = walletState.address;
    if (!addr) return;
    if (!force && walletBalanceAt && (Date.now() - walletBalanceAt) < 30000) return;
    try {
      let sol = null;
      try { sol = await rpcGetBalance(addr, SOLANA_RPC); }
      catch (_) { sol = await rpcGetBalance(addr, SOLANA_RPC_FALLBACK); }
      walletState.balanceSol = sol;
      walletState.balanceErr = false;
    } catch (_) {
      walletState.balanceErr = true;
    }
    walletBalanceAt = Date.now();
    const el = document.getElementById("wallet-bal");
    if (el) {
      el.textContent = walletState.balanceSol != null ? solAmt(walletState.balanceSol) : "Guthaben nicht verfügbar";
    }
  }

        const addr = pk ? pubkeyOf({ publicKey: pk }, provider) : null;

    document.querySelectorAll("#view-settings [data-set-toggle]").forEach(btn => {
      out[btn.dataset.setToggle] = btn.getAttribute("aria-pressed") === "true";
    });
    const seg = document.querySelector("#view-settings [data-set-seg]");
    if (seg) {
      const on = seg.querySelector("button.on");

        if (btn.dataset.setToggle === "daily_limit_on") {
          const w = document.getElementById("daily-warn");

          const h = document.getElementById("tiktok-hint");

            ? "Aktiv: Einsatz, Stop und Trailing folgen dem TikTok-Preset. Weiterhin nur Spielgeld, max. 20 % pro Position."
            : "Aus: vorherige Einstellungen gelten wieder.";
        }
        mark();
      };
    });
    const seg = root.querySelector("[data-set-seg]");
    if (seg) seg.querySelectorAll("button[data-val]").forEach(btn => {
      btn.onclick = () => {
        seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
        mark();
      };
    });
    const save = document.getElementById("btn-settings-save");
    if (save) save.onclick = () => sendSettings("set_settings", collectSettings());
    const def = document.getElementById("btn-settings-default");
    if (def) def.onclick = () => confirmSettings(

  function noteAck(ack) {

    const ts = Number(ack.ts || 0);
    const tsSec = ts > 1e12 ? ts / 1000 : ts;
    if (tsSec && tsSec <= lastAckTs) return false;
    if (tsSec) lastAckTs = tsSec;
    if (tsSec && (Date.now()/1000 - tsSec) > 60) return false; // ignore stale acks on first paint
    const acmd = ack.cmd || "";
    if (acmd === "set_settings" || acmd === "reset_settings" || acmd === "reset_params") {
      if (ack.settings && lastData) lastData.settings = Object.assign(lastData.settings || {}, ack.settings);
      settingsDirty = false;

  }


  let seenTradeKeys = new Set();

  function bannerMessage(t) {

  function burstConfetti() {
    const c = document.getElementById("confetti");
    if (!c) return;
    const w = c.width = window.innerWidth, h = c.height = window.innerHeight;
    const ctx = c.getContext("2d");
    const bits = Array.from({length: 90}, () => ({
      x: Math.random()*w, y: -20 - Math.random()*h*0.3,
      vy: 2+Math.random()*4, vx: -1+Math.random()*2,
      s: 4+Math.random()*6, rot: Math.random()*6, vr: -0.2+Math.random()*0.4,
      col: ["#22F07A","#fff","#0A84FF","#FFD60A","#FF3B30"][Math.floor(Math.random()*5)]
    }));
    const t0 = performance.now();
    const step = (now) => {
      const dt = Math.min(32, now - (step._l || now)); step._l = now;
      ctx.clearRect(0,0,w,h);
      bits.forEach(b => {
        b.vy += 0.08; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
        ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
        ctx.fillStyle = b.col; ctx.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);
        ctx.restore();
      });
      if (now - t0 < 1400) requestAnimationFrame(step);
      else ctx.clearRect(0,0,w,h);
    };
    requestAnimationFrame(step);
  }
  function maybePush(t) {

      setTimeout(() => n.close(), 5000);

  }
  async function requestPushPermission() {
    if (!("Notification" in window)) { setStatus("info", "Dieser Browser kann keine Mitteilungen."); return; }
    const perm = await Notification.requestPermission();
    setStatus(perm === "granted" ? "ok" : "info", perm === "granted" ? "Mitteilungen an." : "Mitteilungen nicht erlaubt.");
  }
  function maybeNotifyTrades(d, seed) {
    const items = (d && (d.trade_events || d.trades)) || [];

    items.forEach(t => {

  }

  function animateText(el, from, to, fmt, ms) {
    if (!el || to == null || Number.isNaN(to)) return;
    const start = (from == null || Number.isNaN(from)) ? to : from;
    const t0 = performance.now();
    const dur = ms || 420;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(start + (to - start) * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  let es = null;
  let rt = null;
  let cmdBusy = false;
  let directWs = null;
  let directUrl = null;
  let liveSource = "poll";

  function loadMqttLib() {
    if (window.mqtt) return Promise.resolve(window.mqtt);
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js";
      s.async = true;
      s.onload = () => resolve(window.mqtt);
      s.onerror = () => reject(new Error("mqtt.js"));
      document.head.appendChild(s);
    });
  }

  let mqttClient = null;
  function connectMqtt(r) {
    const url = r.direct;
    const liveT = r.direct_live, cmdT = r.direct_cmd, ackT = r.direct_ack;
    if (!url || !liveT || !cmdT) return false;
    const ident = url + "|" + liveT;
    if (directUrl === ident && mqttClient && mqttClient.connected) return true;
    try { if (mqttClient) mqttClient.end(true); } catch (_) {}
    directUrl = ident;
    window.__directWsState = "connecting";
    loadMqttLib().then((mqtt) => {
      if (directUrl !== ident) return;
      const broker = (url || "").replace(/\/live\/?$/, "");
      const c = mqtt.connect(broker, {
        username: r.direct_user || "demo",
        protocolVersion: 4,
        clean: true,
        reconnectPeriod: 1500,
        connectTimeout: 8000,
        path: "/mqtt",
        clientId: "fomo-app-" + Math.random().toString(16).slice(2),
      });
      mqttClient = c;
      c.on("connect", () => {
        liveSource = "direct";
        window.__directWsState = "open";
        try { c.subscribe([liveT, ackT].filter(Boolean)); } catch (_) {}
        paintLiveAge();
      });
      c.on("message", (topic, payload) => {
        try {
          const msg = JSON.parse(payload.toString());
          if (!msg) return;
          if (msg.t === "cmdack") {
            if (lastData) lastData.last_cmd_ack = msg;
            if (!msg.pending) noteAck(msg);
            return;
          }
          if (msg.t === "live" || msg.equity_usd != null) applyLive(msg, "direct");
        } catch (_) {}
      });
      c.on("close", () => {
        if (mqttClient === c) {
          window.__directWsState = "closed";
          if (liveSource === "direct") liveSource = "ntfy";
          paintLiveAge();
        }
      });
    }).catch(() => { window.__directWsState = "closed"; });
    return true;
  }

  function connectDirect(d) {
    const r = realtimeCfg(d);
    if (r && r.direct_proto === "mqtt") return connectMqtt(r);
    const url = r && r.direct;
    if (!url) return false;
    if (directWs && directWs.readyState <= 1 && directUrl === url) return true;
    try { if (directWs) directWs.close(); } catch (_) {}
    directUrl = url;
    let ws;
    try { ws = new WebSocket(url); } catch (e) { return false; }
    directWs = ws;
    window.__directWsState = "connecting";
    ws.onopen = () => { liveSource = "direct"; window.__directWsState = "open"; paintLiveAge(); };
    ws.onmessage = (ev) => {
      try {
        const msg = (typeof ev.data === "string") ? JSON.parse(ev.data) : ev.data;
        if (!msg) return;
        if (msg.t === "cmdack") {
          if (lastData) lastData.last_cmd_ack = msg;
          if (!msg.pending) noteAck(msg);
          return;
        }
        if (msg.t === "live" || msg.t === "state" || msg.equity_usd != null) applyLive(msg, "direct");
      } catch (_) {}
    };
    ws.onclose = () => {
      if (directWs === ws) {
        window.__directWsState = "closed";
        if (liveSource === "direct") liveSource = "ntfy";
        paintLiveAge();
        setTimeout(() => { if (lastData) connectDirect(lastData); }, 1500);
      }
    };
    ws.onerror = () => {};
    return true;
  }

  function sendDirect(cmd, extra) {
    const r0 = realtimeCfg(lastData);
    if (r0 && r0.direct_proto === "mqtt") {
      return new Promise((resolve, reject) => {
        if (!mqttClient || !mqttClient.connected || !r0.direct_cmd) return reject(new Error("socket down"));
        const body = JSON.stringify(Object.assign({ cmd, k: r0.key, t: "cmd" }, extra || {}));
        const t0 = Date.now();
        const onmsg = (topic, payload) => {
          try {
            if (r0.direct_ack && topic !== r0.direct_ack) return;
            const msg = JSON.parse(payload.toString());
            if (!msg || msg.t !== "cmdack") return;
            if (msg.ts && (msg.ts * 1000) < t0 - 2000) return;
            mqttClient.off("message", onmsg);
            resolve(msg);
          } catch (_) {}
        };
        mqttClient.on("message", onmsg);
        mqttClient.publish(r0.direct_cmd, body);
        setTimeout(() => { try { mqttClient.off("message", onmsg); } catch (_) {} reject(new Error("timeout")); }, (cmd === "set_settings" || cmd === "reset_settings" || cmd === "reset_params") ? 3500 : 2000);
      });
    }
    return new Promise((resolve, reject) => {
      if (!directWs || directWs.readyState !== 1) return reject(new Error("socket down"));
      const r = realtimeCfg(lastData);
      const body = JSON.stringify(Object.assign({ cmd, k: r && r.key, t: "cmd" }, extra || {}));
      const t0 = Date.now();
      const onmsg = (ev) => {
        try {
          const msg = (typeof ev.data === "string") ? JSON.parse(ev.data) : ev.data;
          if (!msg || msg.t !== "cmdack") return;
          if (msg.ts && (msg.ts * 1000) < t0 - 2000) return;
          directWs.removeEventListener("message", onmsg);
          resolve(msg);
        } catch (_) {}
      };
      directWs.addEventListener("message", onmsg);
      directWs.send(body);
      setTimeout(() => { try { directWs.removeEventListener("message", onmsg); } catch (_) {} reject(new Error("timeout")); }, (cmd === "set_settings" || cmd === "reset_settings" || cmd === "reset_params") ? 3500 : 2000);
    });
  }

  function realtimeCfg(d) {
    return (d && d.realtime) || rt || null;
  }

  function setCmdBusy(on) {
    cmdBusy = !!on;
    document.querySelectorAll("[data-cmd], [data-sell], #sell-all, #dt-sell").forEach(b => { if (b) b.disabled = !!on; });
  }

  function waitForSellAck(mint, all) {
    const t0 = Date.now();
    const before = new Set((lastData && lastData.positions || []).map(p => p.mint).filter(Boolean));
    return new Promise((resolve) => {
      const iv = setInterval(() => {
        const ack = lastData && lastData.last_cmd_ack;
        const ackTsMs = ack && ack.ts ? (ack.ts < 1e12 ? ack.ts * 1000 : ack.ts) : 0;
        if (ack && ack.t === "cmdack" && ackTsMs >= t0 - 2000) {
          const same = all ? (ack.cmd === "sell_all") : (!mint || !ack.mint || ack.mint === mint);
          if (same) { noteAck(ack); clearInterval(iv); resolve(true); return; }
        }
        const now = new Set((lastData && lastData.positions || []).map(p => p.mint).filter(Boolean));
        if (mint && before.has(mint) && !now.has(mint)) {
          setStatus("ok", "Verkauft.");
          clearInterval(iv); resolve(true); return;
        }
        if (all && before.size && now.size === 0) {
          setStatus("ok", "Alle Positionen verkauft.");
          clearInterval(iv); resolve(true); return;
        }
        if (Date.now() - t0 > 8000) {
          setStatus("err", "Bot hat nicht reagiert. Bitte erneut versuchen.");
          clearInterval(iv); resolve(false);
        }
      }, 300);
    });
  }

  async function sendCmd(cmd, extra) {
    const r = realtimeCfg(lastData);
    if (!r || !r.base || !r.topic || !r.key) {
      setStatus("err", "Steuerkanal ist noch nicht bereit. Daten neu laden.");
      return;
    }
    if (cmdBusy) return;
    setCmdBusy(true);
    const isSell = cmd === "sell" || cmd === "sell_all" || (typeof cmd === "string" && cmd.indexOf("sell:") === 0);
    const isSettings = cmd === "set_settings" || cmd === "reset_settings" || cmd === "reset_params";
    if (isSell) setStatus("info", "Verkauf gesendet…");
    else if (isSettings) setStatus("info", "Einstellungen werden gespeichert…");
    else setStatus("info", "Befehl gesendet…");
    if ((cmd === "pause" || cmd === "resume") && lastData) {
      lastData.paused = cmd === "pause";
      lastData.status = cmd === "pause" ? "paused" : "running";
      lastData.status_label = cmd === "pause" ? "Pausiert" : "Läuft";
      lastData.running = cmd !== "pause";
      if (tab === "home") { renderHome(lastData); bindHome(); }
    }
    try {
      if (r.key && ((directWs && directWs.readyState === 1) || (mqttClient && mqttClient.connected))) {
        try {
          const ack = await sendDirect(cmd, extra || {});
          if (lastData) lastData.last_cmd_ack = ack;
          window.__lastSellVia = "direct";
          if (isSell) {
            if (ack && ack.ok && !ack.pending) noteAck(ack);
            else await waitForSellAck(extra && extra.mint, cmd === "sell_all");
          } else if (isSettings) {
            noteAck(ack || { t: "cmdack", cmd, ok: false, ts: Date.now()/1000, error: "Keine Bestätigung" });
          } else {
            setStatus("ok", "Befehl gesendet.");
          }
          return;
        } catch (eDirect) {
          window.__lastSellVia = "direct-failed";
          // fall through to ntfy
        }
      }
      const url = `${String(r.base).replace(/\/$/,"")}/${encodeURIComponent(r.topic)}`;
      const body = JSON.stringify(Object.assign({ cmd, k: r.key, t: "cmd" }, extra || {}));
      let res = null, lastErr = null;
      for (let i = 0; i < 3; i++) {
        try {
          res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain; charset=utf-8", "Priority": "min" },
            body,
            cache: "no-store"
          });
          if (res.ok) break;
          lastErr = "HTTP " + res.status;
        } catch (e) {
          lastErr = e && e.message ? e.message : "Netzwerkfehler";
          res = null;
        }
        if (i < 2) await new Promise(r => setTimeout(r, 400));
      }
      if (!res || !res.ok) {
        setStatus("err", "Befehl konnte nicht gesendet werden" + (lastErr ? " (" + lastErr + ")." : "."));
        return;
      }
      window.__lastSellVia = "ntfy";
      if (isSell) {
        await waitForSellAck(extra && extra.mint, cmd === "sell_all");
      } else if (isSettings) {
        setStatus("info", "Einstellungen unterwegs…");
      } else {
        setStatus("ok", "Befehl gesendet.");
      }
    } catch (e) {
      setStatus("err", "Befehl konnte nicht gesendet werden.");
    } finally {
      setCmdBusy(false);
    }
  }

  function connectLive(d) {
    const r = realtimeCfg(d);
    if (r) rt = r;
    try { connectDirect(d); } catch (_) {}
    if (!r || !r.base || !r.topic) return;
    const url = `${String(r.base).replace(/\/$/,"")}/${encodeURIComponent(r.topic)}/sse`;
    if (es) {
      if (es.url === url) return;
      try { es.close(); } catch (_) {}
    }
    es = new EventSource(url);
    es.onmessage = (ev) => {
      try {
        const wrap = JSON.parse(ev.data);
        const raw = (wrap && wrap.message != null) ? wrap.message : ev.data;
        let msg = (typeof raw === "string" && raw.trim().startsWith("{")) ? JSON.parse(raw)
                  : (raw && typeof raw === "object" ? raw : null);
        // ntfy turns bodies >4KB into attachments; pull the JSON if needed
        if (!msg && wrap && wrap.attachment && wrap.attachment.url) {
          fetch(wrap.attachment.url, { cache: "no-store" }).then(r => r.json()).then(m => {
            if (m && (m.t === "cmdack")) { if (lastData) lastData.last_cmd_ack = m; noteAck(m); }
            else if (m) applyLive(m);
          }).catch(() => {});
          return;
        }
        if (!msg) return;
        if (msg.t === "cmdack") {
          if (lastData) lastData.last_cmd_ack = msg;
          noteAck(msg);
          return;
        }
        if (msg.t === "live" || msg.t === "state" || msg.equity_usd != null || msg.paused != null) {
          applyLive(msg);
        }
      } catch (_) {}
    };
    es.onerror = () => { /* browser reconnects EventSource automatically */ };
  }

  function applyLive(msg) {
    if (!lastData) lastData = {};
    const d = lastData;
    if (msg.paused != null) {
      d.paused = !!msg.paused;
      d.status = d.paused ? "paused" : (d.bot_alive === false ? (d.status || "stopped") : "running");
      d.status_label = d.paused ? "Pausiert" : "Läuft";
      d.running = !d.paused && d.status === "running";
    }
    if (msg.equity_usd != null) d.equity_usd = msg.equity_usd;
    if (msg.equity_eur != null) d.equity_eur = msg.equity_eur;
    if (msg.cash_usd != null) d.cash_usd = msg.cash_usd;
    if (msg.cash_sol != null) d.cash_sol = msg.cash_sol;
    if (msg.equity_sol != null) d.equity_sol = msg.equity_sol;
    if (msg.fees_usd != null) d.fees_usd = msg.fees_usd;
    if (msg.failed_count != null) d.failed_count = msg.failed_count;
    if (msg.loop_latency) d.loop_latency = msg.loop_latency;
    if (msg.spd) {
      d.agents = d.agents || {};
      const map = {nb:"new_to_buy_s", dc:"discovery_s", ss:"seen_to_score_s", sf:"score_to_fill_s", px:"price_s", st:"stop_to_sell_s", ph:"bot_to_phone_s"};
      const cur = Object.assign({}, d.agents.speed || d.speed || {});
      Object.keys(map).forEach(k => { if (msg.spd[k] != null) cur[map[k]] = msg.spd[k]; });
      d.agents.speed = cur;
      d.speed = cur;
    }
    if (msg.direct && d.realtime && d.realtime.direct !== msg.direct) {
      if (d.realtime.direct_proto === "mqtt" && msg.direct_proto !== "mqtt") {
        // snapshot used to append /live to the broker URL; ignore that
      } else {
        d.realtime.direct = msg.direct;
        if (msg.direct_proto) d.realtime.direct_proto = msg.direct_proto;
        try { connectDirect(d); } catch (_) {}
      }
    }
    const fromDirect = (msg.channel === "direct") || arguments[1] === "direct";
    if (fromDirect || liveSource !== "direct") {
      lastTickAt = Date.now();
      if (fromDirect) {
        liveSource = "direct";
        const arr = (window.__liveTicks = window.__liveTicks || []);
        arr.push(Date.now());
        if (arr.length > 50) arr.splice(0, arr.length - 50);
        window.__liveSource = "direct";
      } else if (liveSource !== "direct") {
        liveSource = "ntfy";
        window.__liveSource = "ntfy";
      }
      paintLiveAge();
    }
    if (msg.pnl_usd != null) d.pnl_usd = msg.pnl_usd;
    if (msg.pnl_eur != null) d.pnl_eur = msg.pnl_eur;
    if (msg.roi_pct != null) d.roi_pct = msg.roi_pct;
    if (msg.multiplier != null) d.multiplier = msg.multiplier;
    if (msg.open_count != null) d.open_count = msg.open_count;
    if (msg.halted != null) d.halted = msg.halted;
    const prevPos = {};
    (d.positions || []).forEach(p => { prevPos[p.mint || p.symbol] = p; });
    const prevCount = (d.positions || []).length;
    const prevEq = d.equity_usd;
    const prevPnl = d.pnl_usd;
    if (Array.isArray(msg.positions)) d.positions = msg.positions;
    if (Array.isArray(msg.feed)) {
      d.feed = (d.feed || []).concat(msg.feed);
      mergeFeed(msg.feed);
      if (tab === "feed") renderFeed(d);
    }
    if (msg.feed_stats) d.feed_stats = msg.feed_stats;
    if (msg.settings) {
      d.settings = Object.assign(d.settings || {}, msg.settings);
      if (tab === "settings" && !settingsDirty) renderSettings(d);
    }
    if (Array.isArray(msg.radar)) {
      const prev = d.radar || [];
      d.radar = msg.radar.map(r => {
        const sym = r.symbol || r.s;
        const old = prev.find(x => (x.symbol || x.s) === sym) || {};
        return Object.assign({}, old, {
          symbol: sym,
          score: r.score != null ? r.score : (r.sc != null ? r.sc : old.score),
          early: r.early != null ? r.early : (r.e != null ? r.e : old.early),
          reasons: r.reasons || old.reasons || [],
          mint: r.mint || old.mint || "",
          image_url: r.image_url || old.image_url || "",
          pool: r.pool || old.pool || ""
        });
      });
    }
    if (msg.settings_rev != null) d.settings_rev = msg.settings_rev;
    if (msg.last_cmd_ack) {
      d.last_cmd_ack = msg.last_cmd_ack;
      noteAck(msg.last_cmd_ack);
    }
    if (msg.ts && Array.isArray(d.equity_history) && msg.equity_usd != null) {
      const last = d.equity_history[d.equity_history.length - 1];
      const ts = Date.now() / 1000;
      if (!last || Math.abs((last.equity_usd || last.y || 0) - msg.equity_usd) > 0.001 || (ts - (last.ts || 0)) > 8) {
        d.equity_history = d.equity_history.concat([{ ts, t: msg.ts, equity_usd: msg.equity_usd, equity_eur: msg.equity_eur }]);
      }
    }
    const live = document.getElementById("livepill");
    if (live) {
      live.classList.toggle("off", !d.running && !d.paused);
      live.classList.toggle("paused", !!d.paused);
      if (d.paused) live.innerHTML = `<span class="dot"></span> Paused`;
      else if (d.running) live.innerHTML = `<span class="dot"></span> Live`;
    }
    if (tab === "home") {
      const usdEl = document.querySelector("[data-count=equity_usd]");
      const pnlEl = document.querySelector(".eq-pnl");
      const eurEl = document.querySelector(".eq-eur");
      const st = document.querySelector(".ctrl .st");
      if (usdEl && d.equity_usd != null) animateText(usdEl, prevEq, d.equity_usd, v => usd(v));
      if (eurEl && d.equity_eur != null) eurEl.textContent = eur(d.equity_eur);
      const cashEl = document.querySelector("[data-count=cash_usd]");
      if (cashEl && (d.cash_usd != null || d.cash_sol != null)) {
        cashEl.textContent = "Bargeld " + (d.cash_sol != null ? solAmt(d.cash_sol) + " · " : "") + (d.cash_usd != null ? usd(d.cash_usd) : "");
      }
      if (pnlEl && d.pnl_usd != null) {
        pnlEl.className = "eq-pnl " + cls(d.pnl_usd);
        animateText(pnlEl, prevPnl, d.pnl_usd, v => `${v>=0?"+":""}${usd(v)} (${pct(d.roi_pct, true)})`);
      }
      if (st) {
        st.className = "st " + (d.paused ? "paused" : (d.running ? "" : "off"));
        st.innerHTML = `<span class="dot"></span>${d.paused ? "Paused" : (d.running ? "Running" : (d.status_label || "Offline"))}`;
      }
      const btn = document.querySelector("[data-cmd]");
      if (btn) {
        if (d.paused) { btn.className = "btn-ctrl start"; btn.dataset.cmd = "resume"; btn.textContent = "Start bot"; }
        else { btn.className = "btn-ctrl"; btn.dataset.cmd = "pause"; btn.textContent = "Pause bot"; }
      }
      if (Array.isArray(msg.radar)) {
        const box = document.getElementById("radar-card");
        if (box) {
          const tmp = document.createElement("div");
          tmp.innerHTML = radarHtml(d);
          const next = tmp.querySelector("#radar-card");
          if (next) box.replaceWith(next);
          document.querySelectorAll("#radar-card [data-open]").forEach(btn => btn.onclick = () => openDetail(btn.dataset.open));
        }
      }
      if (Array.isArray(msg.positions) && msg.positions.length !== prevCount) {
        renderHome(d); bindHome();
      } else if (Array.isArray(msg.positions)) {
        msg.positions.forEach(p => {
          const key = p.mint || p.symbol;
          const old = prevPos[key] || {};
          const usdNode = document.querySelector("[data-pnl-usd=\"" + key + "\"]");
          const pctNode = document.querySelector("[data-pnl-pct=\"" + key + "\"]");
          if (usdNode && p.pnl_usd != null) {
            usdNode.className = cls(p.pnl_usd);
            animateText(usdNode, old.pnl_usd, p.pnl_usd, v => (v>=0?"+":"") + usd(v));
          }
          if (pctNode && p.pnl_pct != null) {
            pctNode.className = cls(p.pnl_pct);
            animateText(pctNode, old.pnl_pct, p.pnl_pct, v => pct(v));
          }
        });
      }
      const c = document.getElementById("eqchart");
      if (c) drawEquity(c, filterHistory(d.equity_history || [], tf), d.trade_events || []);
    }
  }

  async function tick() {
    try {
      const d = await loadData();
      render(d, false);
      hideBoot();
    } catch (e) {
      if (lastData) render(lastData, true);
      else {
        hideBoot();
        $("#banners").innerHTML = `<div class="errb">Dashboard-Daten konnten nicht geladen werden.</div>`;
        document.body.dataset.ready = "true";
      }
    }
  }
  let lastTickAt = 0;
  function paintLiveAge() {
    const live = document.getElementById("livepill");
    if (!live || !lastData) return;
    const paused = !!lastData.paused;
    const running = !!lastData.running;
    const age = lastTickAt ? Math.max(0, Math.round((Date.now() - lastTickAt) / 1000)) : null;
    live.classList.toggle("off", !running && !paused);
    live.classList.toggle("paused", paused);
    let label;
    if (paused) label = "Paused";
    else if (liveSource === "direct" && age != null && age <= 3) label = "Live · Direkt";
    else if (liveSource === "direct" && age != null) label = "Live · Direkt · " + age + "s";
    else if (age == null) label = running ? "Live" : (lastData.status_label || "Offline");
    else if (age <= 8) label = "Live · Fallback";
    else label = "Update vor " + age + "s";
    if (age != null && age > 8 && liveSource !== "direct") live.classList.add("off");
    if (age != null && age > 20) live.classList.add("off");
    live.innerHTML = `<span class="dot"></span> ${label}`;
  }
  setInterval(paintLiveAge, 1000);

  bindChrome();
  document.querySelectorAll("#nav [data-tab]").forEach(btn => btn.onclick = () => setTab(btn.dataset.tab));
  try { silentReconnect(); } catch (_) {}
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      try { if (walletState.status !== "connected") silentReconnect(); } catch (_) {}
      if (walletState.status === "connected") refreshBalance(false);
    }
  });
  setInterval(() => { if (walletState.status === "connected") refreshBalance(false); }, 45000);
  tick();
  setInterval(tick, POLL_MS);
  if ("serviceWorker" in navigator) {
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
    navigator.serviceWorker.register("./sw.js?v=16", { updateViaCache: "none" }).then((reg) => {
      const ping = () => { try { reg.update(); } catch (_) {} };
      ping();
      setInterval(ping, 15000);
      if (reg.waiting) { try { reg.waiting.postMessage("skipWaiting"); } catch (_) {} }
      navigator.serviceWorker.addEventListener("message", () => {});
    }).catch(() => {});
  }
  </script>
</body>
